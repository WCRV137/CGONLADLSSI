<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Transmission</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   FULL GAME
   960 x 540
========================= */

#layout {
    position: relative;

    width: 960px;
    height: 540px;

    display: flex;

    overflow: hidden;

    background: black;
}


/* =========================
   LEFT GAME
   640 x 540
========================= */

#gameSide {
    position: relative;

    width: 640px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background: black;
}


/* =========================
   BACKGROUND
========================= */

#background {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-repeat:
        no-repeat;

    z-index: 1;
}


/* =========================
   HIDDEN OBJECT
========================= */

#hiddenObject {
    position: absolute;

    height: auto;

    z-index: 5;

    pointer-events: none;

    user-select: none;
}


/* =========================
   FLOWERS
========================= */

#flowers {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    object-fit: fill;

    z-index: 10;

    pointer-events: none;
}


/* =========================
   GLASS REVEAL
========================= */

#reveal {
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    overflow: hidden;

    transform:
        translate(-50%, -50%);

    display: none;

    pointer-events: none;

    z-index: 30;
}


/* Clean background inside glass */

#revealBackground {
    position: absolute;

    left: 0;
    top: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-repeat:
        no-repeat;
}


/* Hidden object inside glass */

#revealObject {
    position: absolute;

    height: auto;

    pointer-events: none;

    user-select: none;
}


/* =========================
   GLASS
========================= */

#glass {
    position: absolute;

    width: 165px;
    height: 165px;

    border-radius: 50%;

    border:
        6px solid
        rgba(235,235,225,0.95);

    background:
        rgba(190,210,220,0.08);

    box-shadow:
        0 0 15px rgba(0,0,0,0.8),
        inset 0 0 15px rgba(255,255,255,0.25);

    transform:
        translate(-50%, -50%);

    display: none;

    pointer-events: none;

    z-index: 31;
}


/* handle */

#glass::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 85px;

    right: -38px;
    bottom: -62px;

    background:
        #443026;

    border-radius:
        7px;

    transform:
        rotate(-45deg);

    transform-origin:
        top;
}


/* =========================
   NPC SIDE
   320 x 540
========================= */

#npcSide {
    position: relative;

    width: 320px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background: #080808;

    display: flex;

    justify-content: center;
    align-items: flex-end;
}


#npcSide::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(60,60,60,0.18),
            rgba(0,0,0,0.9)
        );

    pointer-events: none;
}


/* =========================
   NPC
========================= */

#npc {
    position: relative;

    z-index: 5;

    width: 310px;

    max-width: 100%;
    max-height: 530px;

    object-fit: contain;

    object-position:
        bottom center;

    cursor: pointer;

    filter:
        drop-shadow(
            0 6px 14px
            rgba(0,0,0,0.85)
        );

    transition:
        transform 0.15s;
}


#npc:hover {
    transform:
        scale(1.015);
}


/* =========================
   DIVIDER
========================= */

#divider {
    position: absolute;

    left: 639px;
    top: 0;

    width: 2px;
    height: 540px;

    background:
        rgba(255,255,255,0.15);

    z-index: 200;

    pointer-events: none;
}


/* =========================
   FADE
========================= */

#fade {
    position: absolute;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.7s ease;

    z-index: 500;
}


#fade.active {
    opacity: 1;
}

</style>

</head>


<body>


<div id="layout">


    <!-- LEFT GAME -->

    <div id="gameSide">

        <div id="background"></div>


        <img
            src="mitten.png"
            id="hiddenObject"
            alt=""
        >


        <img
            src="flowers.png"
            id="flowers"
            alt=""
        >


        <div id="reveal">

            <div
                id="revealBackground"
            ></div>

            <img
                src="mitten.png"
                id="revealObject"
                alt=""
            >

        </div>


        <div id="glass"></div>

    </div>



    <div id="divider"></div>



    <!-- NPC SIDE -->

    <div id="npcSide">

        <img
            src="npc.png"
            id="npc"
            alt="Character"
        >

    </div>



    <div id="fade"></div>


</div>



<!-- VOICE -->

<audio
    id="voiceAudio"
    preload="auto"
></audio>



<script>

/* =========================
   ELEMENTS
========================= */

const gameSide =
    document.getElementById(
        "gameSide"
    );

const hiddenObject =
    document.getElementById(
        "hiddenObject"
    );

const reveal =
    document.getElementById(
        "reveal"
    );

const revealBackground =
    document.getElementById(
        "revealBackground"
    );

const revealObject =
    document.getElementById(
        "revealObject"
    );

const glass =
    document.getElementById(
        "glass"
    );

const npc =
    document.getElementById(
        "npc"
    );

const voiceAudio =
    document.getElementById(
        "voiceAudio"
    );

const fade =
    document.getElementById(
        "fade"
    );


/* =========================
   ROUND SETTINGS
========================= */

const rounds = [

    {
        object:
            "mitten.png",

        voice:
            "mitten.wav",

        rate:
            1.0,

        x:
            155,

        y:
            320,

        width:
            85
    },


    {
        object:
            "lantern.png",

        voice:
            "lantern.wav",

        rate:
            1.28,

        x:
            420,

        y:
            190,

        width:
            95
    },


    {
        object:
            "car.png",

        voice:
            "car.wav",

        rate:
            1.6,

        x:
            245,

        y:
            300,

        width:
            180
    }

];


let currentRound = 0;

let roundChanging = false;

let glassActive = false;

let glassX = 0;
let glassY = 0;

let audioUnlocked = false;


/* =========================
   LOAD ROUND
========================= */

function loadRound(index) {

    const round =
        rounds[index];


    hiddenObject.src =
        round.object;

    hiddenObject.style.left =
        round.x + "px";

    hiddenObject.style.top =
        round.y + "px";

    hiddenObject.style.width =
        round.width + "px";


    revealObject.src =
        round.object;

    revealObject.style.left =
        round.x + "px";

    revealObject.style.top =
        round.y + "px";

    revealObject.style.width =
        round.width + "px";


    /*
        After the player has clicked once,
        later rounds can automatically
        play their instruction.
    */

    if (audioUnlocked) {

        setTimeout(
            playVoice,
            350
        );

    }

}


/* =========================
   PLAY VOICE
========================= */

function playVoice() {

    const round =
        rounds[currentRound];


    voiceAudio.pause();


    /*
        Setting src directly to WAV.
    */

    voiceAudio.src =
        round.voice;


    voiceAudio.load();


    /*
        Faster playback also raises pitch.
    */

    voiceAudio.preservesPitch =
        false;


    if (
        "webkitPreservesPitch"
        in voiceAudio
    ) {

        voiceAudio.webkitPreservesPitch =
            false;

    }


    voiceAudio.playbackRate =
        round.rate;


    voiceAudio.volume =
        1.0;


    voiceAudio.currentTime =
        0;


    voiceAudio
        .play()

        .then(
            function() {

                console.log(
                    "Playing:",
                    round.voice
                );

            }
        )

        .catch(
            function(error) {

                console.error(
                    "VOICE AUDIO ERROR:",
                    error
                );

            }
        );

}


/* =========================
   FIRST CLICK ENABLES AUDIO
========================= */

function unlockAudio() {

    if (audioUnlocked) {
        return;
    }


    audioUnlocked = true;


    /*
        Play instruction because this
        function was triggered by
        a real user click.
    */

    playVoice();

}


document.addEventListener(

    "mousedown",

    unlockAudio,

    {
        once: true
    }

);


/* =========================
   CLICK NPC TO REPLAY
========================= */

npc.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();


        audioUnlocked = true;


        playVoice();

    }

);


/* =========================
   MOVE GLASS
========================= */

function moveGlass(event) {

    const gameRect =
        gameSide
            .getBoundingClientRect();


    const scaleX =

        640 /
        gameRect.width;


    const scaleY =

        540 /
        gameRect.height;


    const localX =

        (
            event.clientX
            -
            gameRect.left
        )

        *
        scaleX;


    const localY =

        (
            event.clientY
            -
            gameRect.top
        )

        *
        scaleY;


    if (

        localX < 0

        ||

        localX > 640

        ||

        localY < 0

        ||

        localY > 540

    ) {

        return;

    }


    glassX =
        localX;

    glassY =
        localY;


    glass.style.left =
        localX + "px";

    glass.style.top =
        localY + "px";


    reveal.style.left =
        localX + "px";

    reveal.style.top =
        localY + "px";


    const revealHalfX =
        reveal.offsetWidth / 2;


    const revealHalfY =
        reveal.offsetHeight / 2;


    revealBackground.style.left =

        (
            -localX
            +
            revealHalfX
        )

        +
        "px";


    revealBackground.style.top =

        (
            -localY
            +
            revealHalfY
        )

        +
        "px";


    revealObject.style.transform =

        "translate("

        +

        (
            -localX
            +
            revealHalfX
        )

        +

        "px,"

        +

        (
            -localY
            +
            revealHalfY
        )

        +

        "px)";

}


/* =========================
   START GLASS
========================= */

gameSide.addEventListener(

    "mousedown",

    function(event) {

        if (roundChanging) {
            return;
        }


        glassActive =
            true;


        glass.style.display =
            "block";


        reveal.style.display =
            "block";


        moveGlass(event);

    }

);


/* =========================
   MOVE GLASS
========================= */

document.addEventListener(

    "mousemove",

    function(event) {

        if (!glassActive) {
            return;
        }


        moveGlass(event);

    }

);


/* =========================
   CHECK OBJECT WHILE CLICKING
========================= */

gameSide.addEventListener(

    "mousedown",

    function() {

        if (roundChanging) {
            return;
        }


        /*
            Check after the glass has
            been positioned.
        */

        setTimeout(
            checkObjectFound,
            20
        );

    }

);


/* =========================
   RELEASE GLASS
========================= */

document.addEventListener(

    "mouseup",

    function() {

        glassActive =
            false;


        glass.style.display =
            "none";


        reveal.style.display =
            "none";

    }

);


/* =========================
   CHECK FOUND OBJECT
========================= */

function checkObjectFound() {

    if (!glassActive) {
        return;
    }


    const round =
        rounds[currentRound];


    const objectCenterX =

        round.x
        +
        round.width / 2;


    const objectCenterY =

        round.y
        +
        round.width / 2;


    const distance =

        Math.sqrt(

            Math.pow(
                glassX
                -
                objectCenterX,
                2
            )

            +

            Math.pow(
                glassY
                -
                objectCenterY,
                2
            )

        );


    /*
        Player needs the glass
        close to the item.
    */

    if (distance < 75) {

        objectFound();

    }

}


/* =========================
   OBJECT FOUND
========================= */

function objectFound() {

    if (roundChanging) {
        return;
    }


    roundChanging =
        true;


    glassActive =
        false;


    glass.style.display =
        "none";


    reveal.style.display =
        "none";


    /*
        Final car round.
    */

    if (
        currentRound
        ===
        rounds.length - 1
    ) {

        finishGame();

        return;

    }


    fade.classList.add(
        "active"
    );


    setTimeout(

        function() {


            currentRound++;


            loadRound(
                currentRound
            );


            setTimeout(

                function() {

                    fade.classList.remove(
                        "active"
                    );


                    roundChanging =
                        false;

                },

                250

            );

        },

        700

    );

}


/* =========================
   FINAL ROUND
========================= */

function finishGame() {

    /*
        Final car scene stays visible.
    */

    roundChanging =
        false;

}


/* =========================
   START GAME
========================= */

loadRound(0);

</script>

</body>

</html>
