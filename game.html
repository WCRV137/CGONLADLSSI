<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transmission</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* ========================================
   WHOLE GAME
======================================== */

#layout {
    position: relative;

    width: 960px;
    height: 540px;

    display: flex;

    flex-shrink: 0;

    overflow: hidden;

    background: black;
}


/* ========================================
   LEFT GAME
======================================== */

#gameSide {
    position: relative;

    width: 640px;
    height: 540px;

    flex: 0 0 640px;

    overflow: hidden;

    cursor: crosshair;

    background: black;
}


/* ========================================
   BACKGROUND
======================================== */

#background {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    background-image: url("background.jpg");

    background-size: 640px 540px;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 1;
}


/* ========================================
   FLOWERS
======================================== */

#flowers {
    position: absolute;

    left: 0;
    top: 0;

    width: 640px;
    height: 540px;

    object-fit: fill;

    user-select: none;
    pointer-events: none;

    z-index: 10;
}


/* ========================================
   REVEAL AREA

   This is the flower-free view.
======================================== */

#reveal {
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    overflow: hidden;

    transform: translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 30;
}


/* clean background */

#revealBackground {
    position: absolute;

    width: 640px;
    height: 540px;

    left: 0;
    top: 0;

    background-image: url("background.jpg");

    background-size: 640px 540px;
    background-position: center;
    background-repeat: no-repeat;
}


/* hidden object */

#revealObject {
    position: absolute;

    height: auto;

    user-select: none;
    pointer-events: none;
}


/* ========================================
   MAGNIFYING GLASS
======================================== */

#glass {
    position: absolute;

    width: 165px;
    height: 165px;

    border-radius: 50%;

    border: 6px solid rgba(235, 235, 225, 0.95);

    background: rgba(190, 210, 220, 0.08);

    box-shadow:
        0 0 15px rgba(0, 0, 0, 0.8),
        inset 0 0 15px rgba(255, 255, 255, 0.25);

    transform: translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 31;
}


/* handle */

#glass::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 85px;

    right: -38px;
    bottom: -62px;

    background: #443026;

    border-radius: 7px;

    transform: rotate(-45deg);

    transform-origin: top;
}


/* ========================================
   NPC SIDE
======================================== */

#npcSide {
    position: relative;

    width: 320px;
    height: 540px;

    flex: 0 0 320px;

    overflow: hidden;

    background: #080808;

    display: flex;
    justify-content: center;
    align-items: flex-end;
}


#npcSide::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(60, 60, 60, 0.18),
            rgba(0, 0, 0, 0.9)
        );

    pointer-events: none;
}


/* ========================================
   NPC
======================================== */

#npc {
    position: relative;

    z-index: 5;

    width: 310px;
    height: auto;

    max-width: 100%;
    max-height: 530px;

    object-fit: contain;
    object-position: bottom center;

    user-select: none;
    pointer-events: none;

    filter:
        drop-shadow(
            0 6px 14px
            rgba(0, 0, 0, 0.85)
        );
}


/* ========================================
   DIVIDER
======================================== */

#divider {
    position: absolute;

    left: 639px;
    top: 0;

    width: 2px;
    height: 540px;

    background: rgba(255, 255, 255, 0.15);

    pointer-events: none;

    z-index: 200;
}


/* ========================================
   ROUND FADE
======================================== */

#fade {
    position: absolute;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.65s ease;

    z-index: 500;
}


#fade.active {
    opacity: 1;
}


/* ========================================
   1964 PNG FLASH
======================================== */

#flash1964 {
    position: absolute;

    inset: 0;

    width: 960px;
    height: 540px;

    background: black;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 9999;
}


#flash1964 img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    user-select: none;
    pointer-events: none;
}


/* ========================================
   RESPONSIVE
======================================== */

@media (max-width: 960px) {

    #layout {
        transform: scale(0.8);
    }

}


@media (max-width: 780px) {

    #layout {
        transform: scale(0.65);
    }

}


@media (max-width: 620px) {

    #layout {
        transform: scale(0.5);
    }

}

</style>

</head>


<body>


<div id="layout">


    <!-- ===============================
         LEFT GAME
    ================================ -->

    <div id="gameSide">


        <div id="background"></div>


        <img
            id="flowers"
            src="flowers.png"
            alt=""
            draggable="false"
        >


        <!-- FLOWERS DISAPPEAR HERE -->

        <div id="reveal">


            <div id="revealBackground"></div>


            <img
                id="revealObject"
                src="mitten.png"
                alt=""
                draggable="false"
            >


        </div>


        <div id="glass"></div>


    </div>



    <!-- ===============================
         DIVIDER
    ================================ -->

    <div id="divider"></div>



    <!-- ===============================
         NPC
    ================================ -->

    <div id="npcSide">


        <img
            id="npc"
            src="npc.png"
            alt="Character"
            draggable="false"
        >


    </div>



    <!-- ===============================
         FADE
    ================================ -->

    <div id="fade"></div>



    <!-- ===============================
         FINAL 1964 IMAGE

         IMPORTANT:
         THIS IS A PNG
    ================================ -->

    <div id="flash1964">


        <img
            src="1964.png"
            alt=""
            draggable="false"
        >


    </div>


</div>



<!-- NPC VOICE -->

<audio
    id="voiceAudio"
    preload="auto"
></audio>



<!-- DAISY MUSIC -->

<audio
    id="backgroundMusic"
    src="daisy.wav"
    preload="auto"
    loop
></audio>



<script>

/* ========================================
   ELEMENTS
======================================== */

const gameSide =
    document.getElementById("gameSide");


const reveal =
    document.getElementById("reveal");


const revealBackground =
    document.getElementById("revealBackground");


const revealObject =
    document.getElementById("revealObject");


const glass =
    document.getElementById("glass");


const fade =
    document.getElementById("fade");


const flash1964 =
    document.getElementById("flash1964");


const voiceAudio =
    document.getElementById("voiceAudio");


const backgroundMusic =
    document.getElementById("backgroundMusic");



/* ========================================
   ROUNDS
======================================== */

const rounds = [


    /* MITTEN */

    {
        object: "mitten.png",

        voice: "mitten.wav",

        startDistortion: 0,

        x: 155,
        y: 320,

        width: 85,
        height: 85
    },


    /* LANTERN */

    {
        object: "lantern.png",

        voice: "lantern.wav",

        startDistortion: 20,

        x: 420,
        y: 190,

        width: 95,
        height: 120
    },


    /* CAR */

    {
        object: "car.png",

        voice: "car.wav",

        startDistortion: 45,

        x: 245,
        y: 300,

        width: 180,
        height: 100
    }

];



/* ========================================
   VARIABLES
======================================== */

let currentRound = 0;


let roundChanging = false;


let glassActive = false;


let glassX = 0;


let glassY = 0;


let audioUnlocked = false;


let voiceTimer = null;


/*
NPC starts repeating every
2 seconds.
*/

let repeatDelay = 2000;


/*
Gets stronger every repetition.
*/

let distortionAmount = 0;


/*
Daisy always stays at the
same volume.
*/

const MUSIC_VOLUME = 0.18;



/* ========================================
   WEB AUDIO
======================================== */

let audioContext = null;

let voiceSource = null;

let distortion = null;

let voiceGain = null;



/* ========================================
   SETUP DISTORTION
======================================== */

function setupAudioGraph() {


    if (audioContext) {

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    voiceSource =
        audioContext.createMediaElementSource(
            voiceAudio
        );


    distortion =
        audioContext.createWaveShaper();


    voiceGain =
        audioContext.createGain();


    /*
    Voice
       ↓
    Distortion
       ↓
    Gain
       ↓
    Speakers
    */

    voiceSource.connect(
        distortion
    );


    distortion.connect(
        voiceGain
    );


    voiceGain.connect(
        audioContext.destination
    );


    distortion.oversample =
        "4x";


    voiceGain.gain.value =
        1.0;

}



/* ========================================
   DISTORTION CURVE
======================================== */

function makeDistortionCurve(amount) {


    const samples = 44100;


    const curve =
        new Float32Array(
            samples
        );


    const deg =
        Math.PI / 180;


    const k =
        Math.max(
            amount,
            0
        );


    for (
        let i = 0;
        i < samples;
        i++
    ) {


        const x =
            i * 2 / samples - 1;


        curve[i] =

            (
                3 + k
            )

            *

            x

            *

            20

            *

            deg

            /

            (
                Math.PI

                +

                k

                *

                Math.abs(x)
            );

    }


    return curve;

}



/* ========================================
   LOAD ROUND
======================================== */

function loadRound(index) {


    const round =
        rounds[index];


    /*
    Change hidden item.
    */

    revealObject.src =
        round.object;


    revealObject.style.left =
        round.x + "px";


    revealObject.style.top =
        round.y + "px";


    revealObject.style.width =
        round.width + "px";


    revealObject.style.height =
        "auto";


    /*
    Reset repetition timer.
    */

    repeatDelay = 2000;


    /*
    Each round can start
    slightly more distorted.
    */

    distortionAmount =
        round.startDistortion;


    clearTimeout(
        voiceTimer
    );


    /*
    Automatically talk
    when next round starts.
    */

    if (audioUnlocked) {


        setTimeout(

            function() {


                playVoice();


                startVoiceReminder();


            },

            350

        );


    }

}



/* ========================================
   PLAY NPC VOICE
======================================== */

function playVoice() {


    if (!audioUnlocked) {

        return;

    }


    const round =
        rounds[currentRound];


    setupAudioGraph();


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext.resume();


    }


    /*
    Restart voice line.
    */

    voiceAudio.pause();


    voiceAudio.currentTime = 0;


    voiceAudio.src =
        round.voice;


    /*
    NORMAL PITCH + SPEED
    */

    voiceAudio.playbackRate = 1.0;


    /*
    Apply distortion.
    */

    distortion.curve =
        makeDistortionCurve(
            distortionAmount
        );


    /*
    Daisy volume is NOT changed.
    */


    voiceAudio
        .play()

        .catch(

            function(error) {


                console.error(
                    "VOICE ERROR:",
                    error
                );


            }

        );

}



/* ========================================
   REPEAT VOICE
======================================== */

function startVoiceReminder() {


    clearTimeout(
        voiceTimer
    );


    const savedRound =
        currentRound;


    voiceTimer =
        setTimeout(

            function() {


                /*
                Stop if the round
                changed.
                */

                if (

                    savedRound !==
                    currentRound

                    ||

                    roundChanging

                ) {


                    return;


                }


                /*
                MORE DISTORTED
                */

                distortionAmount += 12;


                if (
                    distortionAmount > 120
                ) {


                    distortionAmount = 120;


                }


                /*
                Talk again.
                */

                playVoice();


                /*
                REPEAT FASTER
                */

                repeatDelay -= 150;


                if (
                    repeatDelay < 700
                ) {


                    repeatDelay = 700;


                }


                /*
                Schedule another.
                */

                startVoiceReminder();


            },

            repeatDelay

        );

}



/* ========================================
   START AUDIO
======================================== */

function unlockAudio() {


    if (audioUnlocked) {

        return;

    }


    audioUnlocked = true;


    setupAudioGraph();


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext.resume();


    }


    /*
    Start Daisy.
    */

    backgroundMusic.volume =
        MUSIC_VOLUME;


    backgroundMusic
        .play()

        .catch(

            function(error) {


                console.error(
                    "DAISY ERROR:",
                    error
                );


            }

        );


    /*
    Start NPC.
    */

    playVoice();


    startVoiceReminder();

}



/*
Browsers require an interaction
before sound can normally start.
*/

document.addEventListener(

    "pointerdown",

    unlockAudio,

    {
        once: true
    }

);


document.addEventListener(

    "keydown",

    unlockAudio,

    {
        once: true
    }

);



/* ========================================
   MOVE MAGNIFYING GLASS
======================================== */

function moveGlass(event) {


    const rect =
        gameSide.getBoundingClientRect();


    /*
    Account for responsive scaling.
    */

    const scaleX =
        640 / rect.width;


    const scaleY =
        540 / rect.height;


    const localX =

        (
            event.clientX -
            rect.left
        )

        *

        scaleX;


    const localY =

        (
            event.clientY -
            rect.top
        )

        *

        scaleY;


    /*
    Ignore outside game.
    */

    if (

        localX < 0

        ||

        localX > 640

        ||

        localY < 0

        ||

        localY > 540

    ) {


        return;


    }


    glassX = localX;


    glassY = localY;


    /*
    Move glass border.
    */

    glass.style.left =
        localX + "px";


    glass.style.top =
        localY + "px";


    /*
    Move flower-free reveal.
    */

    reveal.style.left =
        localX + "px";


    reveal.style.top =
        localY + "px";


    const halfX =
        reveal.offsetWidth / 2;


    const halfY =
        reveal.offsetHeight / 2;


    /*
    Keep background aligned.
    */

    revealBackground.style.left =

        (
            -localX +
            halfX
        )

        +

        "px";


    revealBackground.style.top =

        (
            -localY +
            halfY
        )

        +

        "px";


    /*
    Keep hidden item aligned.
    */

    revealObject.style.transform =

        "translate("

        +

        (
            -localX +
            halfX
        )

        +

        "px, "

        +

        (
            -localY +
            halfY
        )

        +

        "px)";

}



/* ========================================
   USE MAGNIFYING GLASS
======================================== */

gameSide.addEventListener(

    "pointerdown",

    function(event) {


        if (roundChanging) {

            return;

        }


        glassActive = true;


        /*
        Flowers visually disappear
        inside this circle.
        */

        reveal.style.display =
            "block";


        glass.style.display =
            "block";


        moveGlass(
            event
        );


        checkObjectFound();


    }

);



/* ========================================
   MOVE WHILE HOLDING
======================================== */

document.addEventListener(

    "pointermove",

    function(event) {


        if (!glassActive) {

            return;

        }


        moveGlass(
            event
        );


        /*
        Also check while moving,
        so you can actually search
        with the glass instead of
        needing to click directly.
        */

        checkObjectFound();


    }

);



/* ========================================
   RELEASE GLASS
======================================== */

document.addEventListener(

    "pointerup",

    function() {


        glassActive = false;


        reveal.style.display =
            "none";


        glass.style.display =
            "none";


    }

);



/* ========================================
   CHECK HIDDEN OBJECT
======================================== */

function checkObjectFound() {


    if (!glassActive) {

        return;

    }


    const round =
        rounds[currentRound];


    const left =
        round.x;


    const right =
        round.x +
        round.width;


    const top =
        round.y;


    const bottom =
        round.y +
        round.height;


    /*
    Makes detection slightly easier.
    */

    const padding = 30;


    if (

        glassX >=
        left - padding

        &&

        glassX <=
        right + padding

        &&

        glassY >=
        top - padding

        &&

        glassY <=
        bottom + padding

    ) {


        objectFound();


    }

}



/* ========================================
   OBJECT FOUND
======================================== */

function objectFound() {


    if (roundChanging) {

        return;

    }


    roundChanging = true;


    /*
    Stop current NPC repetition.
    */

    clearTimeout(
        voiceTimer
    );


    voiceAudio.pause();


    /*
    Hide glass.
    */

    glassActive = false;


    reveal.style.display =
        "none";


    glass.style.display =
        "none";


    /*
    ================================
    FINAL CAR
    ================================
    */

    if (

        currentRound >=
        rounds.length - 1

    ) {


        finishGame();


        return;


    }


    /*
    ================================
    NEXT ROUND
    ================================
    */

    fade.classList.add(
        "active"
    );


    setTimeout(

        function() {


            currentRound++;


            loadRound(
                currentRound
            );


            setTimeout(

                function() {


                    fade.classList.remove(
                        "active"
                    );


                    roundChanging = false;


                },

                250

            );


        },

        650

    );

}



/* ========================================
   CAR ENDING
======================================== */

function finishGame() {


    clearTimeout(
        voiceTimer
    );


    voiceAudio.pause();


    glassActive = false;


    reveal.style.display =
        "none";


    glass.style.display =
        "none";


    /*
    ===================================
    SHOW 1964.PNG
    ===================================
    */

    flash1964.style.display =
        "flex";


    /*
    Daisy continues underneath.
    */


    /*
    Show the image for 1 second.
    */

    setTimeout(

        function() {


            /*
            Return to your main
            countdown page.
            */

            window.location.href =
                "index.html";


        },

        1000

    );

}



/* ========================================
   START GAME
======================================== */

loadRound(0);


</script>


</body>

</html>
