<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Transmission</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: "Courier New", monospace;
}


/* =========================================
   WHOLE GAME
   960 x 540
========================================= */

#layout {
    position: relative;

    width: 960px;
    height: 540px;

    display: flex;

    overflow: hidden;

    background: black;
}


/* =========================================
   LEFT GAME SIDE
   640 x 540
========================================= */

#gameSide {
    position: relative;

    width: 640px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background: black;

    cursor: crosshair;
}


/* =========================================
   ROUND BACKGROUND
========================================= */

#background {
    position: absolute;

    left: 0;
    top: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("round1.jpg");

    background-size:
        640px 540px;

    background-position:
        center;

    background-repeat:
        no-repeat;

    z-index: 1;
}


/* =========================================
   FLOWER OVERLAY
========================================= */

#flowers {
    position: absolute;

    left: 0;
    top: 0;

    width: 640px;
    height: 540px;

    object-fit: fill;

    pointer-events: none;

    z-index: 10;
}


/* =========================================
   REVEAL THROUGH GLASS
========================================= */

#reveal {
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    background-image:
        url("round1.jpg");

    background-size:
        640px 540px;

    background-repeat:
        no-repeat;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 30;
}


/* =========================================
   MAGNIFYING GLASS
========================================= */

#glass {
    position: absolute;

    width: 165px;
    height: 165px;

    border-radius: 50%;

    border:
        6px solid
        rgba(235,235,225,0.95);

    background:
        rgba(190,210,220,0.08);

    box-shadow:
        0 0 15px rgba(0,0,0,0.8),
        inset 0 0 15px rgba(255,255,255,0.25);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 31;
}


/* glass handle */

#glass::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 85px;

    right: -38px;
    bottom: -62px;

    background: #443026;

    border-radius: 7px;

    transform:
        rotate(-45deg);

    transform-origin: top;
}


/* =========================================
   RIGHT NPC SIDE
   320 x 540
========================================= */

#npcSide {
    position: relative;

    width: 320px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background: #080808;

    display: flex;

    justify-content: center;
    align-items: flex-end;
}


#npcSide::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(60,60,60,0.18),
            rgba(0,0,0,0.9)
        );

    pointer-events: none;
}


/* =========================================
   NPC
========================================= */

#npc {
    position: relative;

    z-index: 5;

    width: 310px;

    max-width: 100%;
    max-height: 530px;

    object-fit: contain;

    object-position:
        bottom center;

    cursor: pointer;

    filter:
        drop-shadow(
            0 6px 14px
            rgba(0,0,0,0.85)
        );

    transition:
        transform 0.15s,
        filter 0.15s;
}


#npc:hover {
    transform:
        scale(1.015);

    filter:
        brightness(1.04)
        drop-shadow(
            0 6px 14px
            rgba(0,0,0,0.85)
        );
}


/* =========================================
   DIVIDER
========================================= */

#divider {
    position: absolute;

    left: 639px;
    top: 0;

    width: 2px;
    height: 540px;

    background:
        rgba(255,255,255,0.15);

    z-index: 200;

    pointer-events: none;
}


/* =========================================
   ROUND FADE
========================================= */

#fade {
    position: absolute;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    z-index: 500;

    transition:
        opacity 0.8s ease;
}


#fade.active {
    opacity: 1;
}


/* =========================================
   SMALL SCREEN SCALING
========================================= */

@media (max-width: 960px) {

    #layout {
        transform:
            scale(0.8);
    }

}

@media (max-width: 780px) {

    #layout {
        transform:
            scale(0.65);
    }

}

@media (max-width: 620px) {

    #layout {
        transform:
            scale(0.5);
    }

}

</style>

</head>


<body>


<div id="layout">


    <!-- =====================================
         LEFT SIDE
    ====================================== -->

    <div id="gameSide">

        <div id="background"></div>

        <img
            src="flowers.png"
            id="flowers"
            alt=""
        >

        <div id="reveal"></div>

        <div id="glass"></div>

    </div>



    <div id="divider"></div>



    <!-- =====================================
         NPC SIDE
    ====================================== -->

    <div id="npcSide">

        <img
            src="npc.png"
            id="npc"
            alt="Character"
        >

    </div>



    <div id="fade"></div>


</div>


<audio
    id="voiceAudio"
    preload="auto"
></audio>


<script>

/* =========================================
   ELEMENTS
========================================= */

const gameSide =
    document.getElementById("gameSide");

const background =
    document.getElementById("background");

const flowers =
    document.getElementById("flowers");

const reveal =
    document.getElementById("reveal");

const glass =
    document.getElementById("glass");

const npc =
    document.getElementById("npc");

const voiceAudio =
    document.getElementById("voiceAudio");

const fade =
    document.getElementById("fade");


let glassActive = false;

let currentRound = 0;

let roundChanging = false;



/* =========================================
   ROUND SETTINGS
========================================= */


/*
You need:

round1.jpg
round2.jpg
round3.jpg

The third image can contain:
- the car
- the distant non-graphic figure
*/

const rounds = [

    {
        background:
            "round1.jpg",

        voice:
            "mitten.mp3",

        rate:
            1.0
    },


    {
        background:
            "round2.jpg",

        voice:
            "lantern.mp3",

        rate:
            1.28
    },


    {
        background:
            "round3.jpg",

        voice:
            "car.mp3",

        rate:
            1.6
    }

];



/* =========================================
   LOAD ROUND
========================================= */

function loadRound(index) {

    const round =
        rounds[index];


    background.style.backgroundImage =
        'url("' +
        round.background +
        '")';


    reveal.style.backgroundImage =
        'url("' +
        round.background +
        '")';


    playRoundVoice();

}



/* =========================================
   VOICE
========================================= */

function playRoundVoice() {

    const round =
        rounds[currentRound];


    voiceAudio.pause();

    voiceAudio.currentTime =
        0;


    voiceAudio.src =
        round.voice;


    /*
    Turning this OFF means
    changing playbackRate also
    changes pitch.
    */

    voiceAudio.preservesPitch =
        false;


    /*
    ROUND 1:
    normal

    ROUND 2:
    faster + higher

    ROUND 3:
    much faster + higher
    */

    voiceAudio.playbackRate =
        round.rate;


    voiceAudio.volume =
        0.9;


    voiceAudio
        .play()
        .catch(
            function(error) {

                console.log(
                    "Voice could not play:",
                    error
                );

            }
        );

}



/* =========================================
   CLICK NPC TO HEAR CURRENT INSTRUCTION
========================================= */

npc.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();

        playRoundVoice();

    }

);



/* =========================================
   GLASS MOVEMENT
========================================= */

function moveGlass(event) {

    const gameRect =
        gameSide.getBoundingClientRect();


    /*
    Convert browser mouse coordinates
    to our 640x540 coordinates.
    */

    const scaleX =
        640 /
        gameRect.width;


    const scaleY =
        540 /
        gameRect.height;


    const localX =

        (
            event.clientX
            -
            gameRect.left
        )

        *

        scaleX;


    const localY =

        (
            event.clientY
            -
            gameRect.top
        )

        *

        scaleY;



    if (

        localX < 0

        ||

        localX > 640

        ||

        localY < 0

        ||

        localY > 540

    ) {

        return;

    }



    glass.style.left =
        localX + "px";


    glass.style.top =
        localY + "px";


    reveal.style.left =
        localX + "px";


    reveal.style.top =
        localY + "px";



    const halfWidth =
        reveal.offsetWidth / 2;


    const halfHeight =
        reveal.offsetHeight / 2;



    reveal.style.backgroundPosition =

        (
            -localX
            +
            halfWidth
        )

        +

        "px "

        +

        (
            -localY
            +
            halfHeight
        )

        +

        "px";

}



/* =========================================
   START GLASS
========================================= */

gameSide.addEventListener(

    "mousedown",

    function(event) {

        if (roundChanging) {
            return;
        }


        glassActive =
            true;


        glass.style.display =
            "block";


        reveal.style.display =
            "block";


        moveGlass(event);

    }

);



/* =========================================
   MOVE GLASS
========================================= */

document.addEventListener(

    "mousemove",

    function(event) {

        if (!glassActive) {
            return;
        }


        moveGlass(event);

    }

);



/* =========================================
   RELEASE GLASS
========================================= */

document.addEventListener(

    "mouseup",

    function() {

        glassActive =
            false;


        glass.style.display =
            "none";


        reveal.style.display =
            "none";

    }

);



/* =========================================
   ADVANCE ROUND

   For now:
   DOUBLE CLICK left side
   when you have found the object.

   Later we can replace this with
   actual object detection.
========================================= */

gameSide.addEventListener(

    "dblclick",

    function() {

        if (roundChanging) {
            return;
        }


        nextRound();

    }

);



/* =========================================
   NEXT ROUND
========================================= */

function nextRound() {

    /*
    Round 3 is the final round.
    */

    if (

        currentRound >=
        rounds.length - 1

    ) {

        return;

    }


    roundChanging =
        true;


    glassActive =
        false;


    glass.style.display =
        "none";


    reveal.style.display =
        "none";


    fade.classList.add(
        "active"
    );


    setTimeout(

        function() {

            currentRound++;


            loadRound(
                currentRound
            );


            setTimeout(

                function() {

                    fade.classList.remove(
                        "active"
                    );


                    roundChanging =
                        false;

                },

                250

            );

        },

        850

    );

}



/* =========================================
   START ROUND 1

   Because browsers block autoplay,
   the player needs to click NPC once.
========================================= */

loadRound(0);

</script>

</body>

</html>
