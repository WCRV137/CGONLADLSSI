<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Transmission</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   WHOLE WINDOW
========================================= */

#layout {
    position: relative;

    width: 960px;
    height: 540px;

    display: flex;

    overflow: hidden;

    background: black;
}


/* =========================================
   LEFT GAME
   640 x 540
========================================= */

#gameSide {
    position: relative;

    width: 640px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background: black;

    cursor: crosshair;
}


/* =========================================
   BACKGROUND
========================================= */

#background {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-repeat:
        no-repeat;

    background-position:
        center;

    z-index: 1;
}


/* =========================================
   REAL HIDDEN OBJECT
========================================= */

#hiddenObject {
    position: absolute;

    height: auto;

    z-index: 5;

    pointer-events: none;

    user-select: none;
}


/* =========================================
   FLOWERS
========================================= */

#flowers {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    object-fit: fill;

    pointer-events: none;

    user-select: none;

    z-index: 10;
}


/* =========================================
   GLASS REVEAL
========================================= */

#reveal {
    position: absolute;

    width: 150px;
    height: 150px;

    border-radius: 50%;

    overflow: hidden;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 30;
}


/* Background visible inside glass */

#revealBackground {
    position: absolute;

    left: 0;
    top: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-repeat:
        no-repeat;
}


/* Object visible inside glass */

#revealObject {
    position: absolute;

    height: auto;

    pointer-events: none;

    user-select: none;
}


/* =========================================
   GLASS
========================================= */

#glass {
    position: absolute;

    width: 165px;
    height: 165px;

    border-radius: 50%;

    border:
        6px solid
        rgba(235,235,225,0.95);

    background:
        rgba(190,210,220,0.08);

    box-shadow:
        0 0 15px rgba(0,0,0,0.8),
        inset 0 0 15px rgba(255,255,255,0.25);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 31;
}


/* Glass handle */

#glass::after {
    content: "";

    position: absolute;

    width: 20px;
    height: 85px;

    right: -38px;
    bottom: -62px;

    background:
        #443026;

    border-radius:
        7px;

    transform:
        rotate(-45deg);

    transform-origin:
        top;
}


/* =========================================
   NPC SIDE
   320 x 540
========================================= */

#npcSide {
    position: relative;

    width: 320px;
    height: 540px;

    flex-shrink: 0;

    overflow: hidden;

    background:
        #080808;

    display: flex;

    justify-content: center;
    align-items: flex-end;
}


#npcSide::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(60,60,60,0.18),
            rgba(0,0,0,0.9)
        );

    pointer-events: none;
}


/* =========================================
   NPC
========================================= */

#npc {
    position: relative;

    z-index: 5;

    width: 310px;

    max-width: 100%;
    max-height: 530px;

    object-fit: contain;

    object-position:
        bottom center;

    pointer-events: none;

    filter:
        drop-shadow(
            0 6px 14px
            rgba(0,0,0,0.85)
        );
}


/* =========================================
   DIVIDER
========================================= */

#divider {
    position: absolute;

    left: 639px;
    top: 0;

    width: 2px;
    height: 540px;

    background:
        rgba(255,255,255,0.15);

    z-index: 200;

    pointer-events: none;
}


/* =========================================
   FADE
========================================= */

#fade {
    position: absolute;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.7s ease;

    z-index: 500;
}


#fade.active {
    opacity: 1;
}


/* =========================================
   SMALL SCREEN SCALING
========================================= */

@media (max-width: 960px) {

    #layout {
        transform:
            scale(0.8);
    }

}

@media (max-width: 780px) {

    #layout {
        transform:
            scale(0.65);
    }

}

@media (max-width: 620px) {

    #layout {
        transform:
            scale(0.5);
    }

}

</style>

</head>


<body>


<div id="layout">


    <!-- LEFT SIDE -->

    <div id="gameSide">

        <div id="background"></div>


        <img
            src="mitten.png"
            id="hiddenObject"
            alt=""
        >


        <img
            src="flowers.png"
            id="flowers"
            alt=""
        >


        <div id="reveal">

            <div
                id="revealBackground"
            ></div>

            <img
                src="mitten.png"
                id="revealObject"
                alt=""
            >

        </div>


        <div id="glass"></div>

    </div>



    <div id="divider"></div>



    <!-- RIGHT SIDE -->

    <div id="npcSide">

        <img
            src="npc.png"
            id="npc"
            alt="Character"
        >

    </div>



    <div id="fade"></div>


</div>



<audio
    id="voiceAudio"
    preload="auto"
></audio>



<script>

/* =========================================
   ELEMENTS
========================================= */

const gameSide =
    document.getElementById(
        "gameSide"
    );

const hiddenObject =
    document.getElementById(
        "hiddenObject"
    );

const reveal =
    document.getElementById(
        "reveal"
    );

const revealBackground =
    document.getElementById(
        "revealBackground"
    );

const revealObject =
    document.getElementById(
        "revealObject"
    );

const glass =
    document.getElementById(
        "glass"
    );

const voiceAudio =
    document.getElementById(
        "voiceAudio"
    );

const fade =
    document.getElementById(
        "fade"
    );


/* =========================================
   ROUND SETTINGS
========================================= */

const rounds = [

    {
        object:
            "mitten.png",

        voice:
            "mitten.wav",

        rate:
            1.0,

        x:
            155,

        y:
            320,

        width:
            85
    },


    {
        object:
            "lantern.png",

        voice:
            "lantern.wav",

        rate:
            1.28,

        x:
            420,

        y:
            190,

        width:
            95
    },


    {
        object:
            "car.png",

        voice:
            "car.wav",

        rate:
            1.6,

        x:
            245,

        y:
            300,

        width:
            180
    }

];


let currentRound =
    0;


let roundChanging =
    false;


let glassActive =
    false;


let glassX =
    0;


let glassY =
    0;


/*
Browser needs the player to interact
once before sound is allowed.
*/

let audioUnlocked =
    false;


/*
Used for repeating the NPC instruction.
*/

let voiceTimer =
    null;



/* =========================================
   LOAD CURRENT ROUND
========================================= */

function loadRound(index) {

    const round =
        rounds[index];


    /* REAL OBJECT */

    hiddenObject.src =
        round.object;


    hiddenObject.style.left =
        round.x + "px";


    hiddenObject.style.top =
        round.y + "px";


    hiddenObject.style.width =
        round.width + "px";


    /* OBJECT INSIDE GLASS */

    revealObject.src =
        round.object;


    revealObject.style.left =
        round.x + "px";


    revealObject.style.top =
        round.y + "px";


    revealObject.style.width =
        round.width + "px";


    /*
    If audio was already unlocked,
    automatically say the new item.
    */

    if (audioUnlocked) {

        setTimeout(

            function() {

                playVoice();

                startVoiceReminder();

            },

            400

        );

    }

}



/* =========================================
   NPC VOICE
========================================= */

function playVoice() {

    if (!audioUnlocked) {

        return;

    }


    const round =
        rounds[currentRound];


    voiceAudio.pause();


    voiceAudio.currentTime =
        0;


    voiceAudio.src =
        round.voice;


    /*
    Make changing playbackRate
    change BOTH speed + pitch.
    */

    voiceAudio.preservesPitch =
        false;


    if (
        "webkitPreservesPitch"
        in voiceAudio
    ) {

        voiceAudio.webkitPreservesPitch =
            false;

    }


    voiceAudio.playbackRate =
        round.rate;


    voiceAudio.volume =
        1.0;


    voiceAudio
        .play()

        .then(

            function() {

                console.log(
                    "NPC TALKING:",
                    round.voice
                );

            }

        )

        .catch(

            function(error) {

                console.error(
                    "VOICE ERROR:",
                    error
                );

            }

        );

}



/* =========================================
   REPEAT NPC VOICE
========================================= */

function startVoiceReminder() {

    clearTimeout(
        voiceTimer
    );


    const savedRound =
        currentRound;


    voiceTimer =
        setTimeout(

            function() {


                if (

                    savedRound ===
                    currentRound

                    &&

                    !roundChanging

                ) {


                    playVoice();


                    startVoiceReminder();

                }

            },

            8000

        );

}



/* =========================================
   UNLOCK AUDIO
========================================= */

function unlockGameAudio() {

    if (audioUnlocked) {

        return;

    }


    audioUnlocked =
        true;


    /*
    Immediately speak current instruction.
    */

    playVoice();


    startVoiceReminder();

}



/*
Any first click/touch on the game
starts the voice system.
*/

document.addEventListener(

    "pointerdown",

    unlockGameAudio,

    {
        once: true
    }

);


document.addEventListener(

    "keydown",

    unlockGameAudio,

    {
        once: true
    }

);



/* =========================================
   MOVE GLASS
========================================= */

function moveGlass(event) {

    const gameRect =
        gameSide
            .getBoundingClientRect();


    const scaleX =

        640 /
        gameRect.width;


    const scaleY =

        540 /
        gameRect.height;


    const localX =

        (
            event.clientX
            -
            gameRect.left
        )

        *
        scaleX;


    const localY =

        (
            event.clientY
            -
            gameRect.top
        )

        *
        scaleY;


    if (

        localX < 0

        ||

        localX > 640

        ||

        localY < 0

        ||

        localY > 540

    ) {

        return;

    }


    glassX =
        localX;


    glassY =
        localY;


    /* GLASS */

    glass.style.left =
        localX + "px";


    glass.style.top =
        localY + "px";


    /* REVEAL */

    reveal.style.left =
        localX + "px";


    reveal.style.top =
        localY + "px";


    const revealHalfX =
        reveal.offsetWidth / 2;


    const revealHalfY =
        reveal.offsetHeight / 2;


    /*
    Move world inside reveal in the
    opposite direction.
    */

    revealBackground.style.left =

        (
            -localX
            +
            revealHalfX
        )

        +
        "px";


    revealBackground.style.top =

        (
            -localY
            +
            revealHalfY
        )

        +
        "px";


    revealObject.style.transform =

        "translate("

        +

        (
            -localX
            +
            revealHalfX
        )

        +

        "px,"

        +

        (
            -localY
            +
            revealHalfY
        )

        +

        "px)";

}



/* =========================================
   START GLASS
========================================= */

gameSide.addEventListener(

    "pointerdown",

    function(event) {

        if (roundChanging) {

            return;

        }


        glassActive =
            true;


        glass.style.display =
            "block";


        reveal.style.display =
            "block";


        moveGlass(event);


        /*
        Check immediately whether
        player clicked the object.
        */

        setTimeout(

            checkObjectFound,

            25

        );

    }

);



/* =========================================
   MOVE GLASS
========================================= */

document.addEventListener(

    "pointermove",

    function(event) {

        if (!glassActive) {

            return;

        }


        moveGlass(event);

    }

);



/* =========================================
   STOP GLASS
========================================= */

document.addEventListener(

    "pointerup",

    function() {

        glassActive =
            false;


        glass.style.display =
            "none";


        reveal.style.display =
            "none";

    }

);



/* =========================================
   CHECK OBJECT
========================================= */

function checkObjectFound() {

    if (!glassActive) {

        return;

    }


    const round =
        rounds[currentRound];


    const objectCenterX =

        round.x
        +
        round.width / 2;


    const objectCenterY =

        round.y
        +
        round.width / 2;


    const distance =

        Math.sqrt(

            Math.pow(

                glassX
                -
                objectCenterX,

                2

            )

            +

            Math.pow(

                glassY
                -
                objectCenterY,

                2

            )

        );


    /*
    Glass must be near the hidden item.
    */

    if (distance < 75) {

        objectFound();

    }

}



/* =========================================
   OBJECT FOUND
========================================= */

function objectFound() {

    if (roundChanging) {

        return;

    }


    roundChanging =
        true;


    clearTimeout(
        voiceTimer
    );


    voiceAudio.pause();


    glassActive =
        false;


    glass.style.display =
        "none";


    reveal.style.display =
        "none";


    /*
    CAR = FINAL ROUND
    */

    if (

        currentRound ===
        rounds.length - 1

    ) {

        finishGame();

        return;

    }


    /* FADE OUT */

    fade.classList.add(
        "active"
    );


    setTimeout(

        function() {


            currentRound++;


            loadRound(
                currentRound
            );


            setTimeout(

                function() {


                    fade.classList.remove(
                        "active"
                    );


                    roundChanging =
                        false;

                },

                300

            );

        },

        750

    );

}



/* =========================================
   FINAL ROUND
========================================= */

function finishGame() {

    /*
    Keep the final scene visible.
    */

    roundChanging =
        false;


    /*
    Stop automatic reminders.
    */

    clearTimeout(
        voiceTimer
    );

}



/* =========================================
   START GAME
========================================= */

loadRound(0);

</script>

</body>

</html>
