<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>137-day Countdown</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Countdown — 137 days</h1>
    <div id="countdown" aria-live="polite">
      <div class="time"><span id="days">137</span><span class="label">days</span></div>
      <div class="time"><span id="hours">00</span><span class="label">hours</span></div>
      <div class="time"><span id="minutes">00</span><span class="label">minutes</span></div>
      <div class="time"><span id="seconds">00</span><span class="label">seconds</span></div>
    </div>
    <p class="note">Target is set to 137 days from when the page is loaded.</p>
    <button id="reset">Reset target to now + 137 days</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
