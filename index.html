<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CGONLADLSSI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #e8e4d6;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        .main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 8px;
            opacity: 0.65;
        }

        #countdown {
            margin-top: 25px;
            font-size: clamp(35px, 7vw, 85px);
            letter-spacing: 4px;
        }

        #broadcastStatus {
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 4px;
            opacity: 0.45;
        }

        #soundNotice {
            margin-top: 10px;
            font-size: 9px;
            letter-spacing: 2px;
            opacity: 0.35;
        }

        /* =========================
           RADIO IMAGE
        ========================= */

        .radio-image-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            text-align: center;
            user-select: none;
        }

        #radioImage {
            width: 220px;
            max-width: 35vw;
            height: auto;
            cursor: pointer;

            transition:
                transform 0.15s,
                filter 0.3s,
                opacity 0.3s;
        }

        #radioImage:hover {
            transform: scale(1.03);
        }

        #radioImage:active {
            transform: scale(0.96);
        }

        #radioImage.radio-playing {
            filter:
                brightness(1.12)
                drop-shadow(
                    0 0 10px
                    rgba(255, 220, 150, 0.35)
                );
        }

        #radioImage.radio-dead {
            filter:
                grayscale(100%)
                brightness(0.65);

            cursor: default;
        }

        #radioStatus {
            margin-top: 5px;
            font-size: 9px;
            letter-spacing: 3px;
            color: #aaa;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            #countdown {
                font-size: 32px;
            }

            .radio-image-container {
                right: 10px;
                bottom: 10px;
            }

            #radioImage {
                width: 140px;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <h1>CGONLADLSSI</h1>

        <div id="countdown">
            LOADING
        </div>

        <div id="broadcastStatus">
            BROADCAST ACTIVE
        </div>

        <div id="soundNotice">
            CLICK ANYWHERE TO ENABLE AUDIO
        </div>

    </div>

    <div class="radio-image-container">

        <img
            src="radio.png"
            id="radioImage"
            alt="Radio"
        >

        <div id="radioStatus">
            OFF
        </div>

    </div>

    <!-- RADIO MUSIC -->
    <audio
        id="radioAudio"
        preload="metadata"
    ></audio>

    <!-- CLOCK SOUNDS -->
    <audio
        id="tickSound"
        src="sounds/tick.mp3"
        preload="auto"
    ></audio>

    <audio
        id="tockSound"
        src="sounds/tock.mp3"
        preload="auto"
    ></audio>

    <script>

        /* =========================
           COUNTDOWN
        ========================= */

        const countdownLength =
            137 *
            24 *
            60 *
            60 *
            1000;

        let endDate =
            localStorage.getItem(
                "CGONLADLSSI_endDate"
            );

        if (!endDate) {

            endDate =
                Date.now()
                +
                countdownLength;

            localStorage.setItem(
                "CGONLADLSSI_endDate",
                endDate
            );
        }

        endDate =
            Number(endDate);

        const countdownElement =
            document.getElementById(
                "countdown"
            );

        const broadcastStatus =
            document.getElementById(
                "broadcastStatus"
            );

        const soundNotice =
            document.getElementById(
                "soundNotice"
            );

        function getTimeRemaining() {

            return (
                endDate
                -
                Date.now()
            );
        }

        function getDaysRemaining() {

            const distance =
                getTimeRemaining();

            return Math.floor(
                distance /
                (
                    1000 *
                    60 *
                    60 *
                    24
                )
            );
        }

        function updateCountdown() {

            const distance =
                getTimeRemaining();

            if (distance <= 0) {

                countdownElement.textContent =
                    "0D 00H 00M 00S";

                broadcastStatus.textContent =
                    "TRANSMISSION ENDED";

                disableRadio();

                clockEnabled = false;

                return;
            }

            const days =
                Math.floor(
                    distance /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );

            const hours =
                Math.floor(
                    distance /
                    (
                        1000 *
                        60 *
                        60
                    )
                ) % 24;

            const minutes =
                Math.floor(
                    distance /
                    (
                        1000 *
                        60
                    )
                ) % 60;

            const seconds =
                Math.floor(
                    distance /
                    1000
                ) % 60;

            countdownElement.textContent =
                days +
                "D " +
                String(hours).padStart(2, "0") +
                "H " +
                String(minutes).padStart(2, "0") +
                "M " +
                String(seconds).padStart(2, "0") +
                "S";

            checkRadioCountdown();
        }

        updateCountdown();

        /* =========================
           CLOCK TICK / TOCK
        ========================= */

        const tickSound =
            document.getElementById(
                "tickSound"
            );

        const tockSound =
            document.getElementById(
                "tockSound"
            );

        tickSound.volume = 0.20;
        tockSound.volume = 0.20;

        let tickNext = true;
        let clockEnabled = false;

        function playClockSound() {

            if (!clockEnabled) {
                return;
            }

            if (getTimeRemaining() <= 0) {
                return;
            }

            if (tickNext) {

                tickSound.currentTime = 0;

                tickSound
                    .play()
                    .catch(() => {});

            } else {

                tockSound.currentTime = 0;

                tockSound
                    .play()
                    .catch(() => {});
            }

            tickNext = !tickNext;
        }

        /* =========================
           MAIN TIMER LOOP
        ========================= */

        setInterval(
            function() {

                updateCountdown();

                playClockSound();

            },
            1000
        );

        /* =========================
           ENABLE AUDIO
        ========================= */

        function enableSiteAudio() {

            if (clockEnabled) {
                return;
            }

            clockEnabled = true;

            soundNotice.textContent =
                "AUDIO ENABLED";

            playClockSound();
        }

        document.addEventListener(
            "click",
            enableSiteAudio,
            { once: true }
        );

        document.addEventListener(
            "keydown",
            enableSiteAudio,
            { once: true }
        );

        /* =========================
           RADIO
        ========================= */

        const radioAudio =
            document.getElementById(
                "radioAudio"
            );

        const radioImage =
            document.getElementById(
                "radioImage"
            );

        const radioStatus =
            document.getElementById(
                "radioStatus"
            );

        const songs = [

            "music/song1.mp3",
            "music/song2.mp3",
            "music/song3.mp3",
            "music/song4.mp3",
            "music/song5.mp3"

        ];

        let radioOn = false;
        let currentSong = "";

        radioAudio.volume = 0.35;

        function randomSong() {

            if (songs.length === 0) {
                return;
            }

            let song;

            do {

                const randomIndex =
                    Math.floor(
                        Math.random()
                        *
                        songs.length
                    );

                song =
                    songs[
                        randomIndex
                    ];

            } while (
                song === currentSong
                &&
                songs.length > 1
            );

            currentSong =
                song;

            radioAudio.src =
                song;

            radioAudio
                .play()
                .catch(
                    function(error) {

                        console.log(
                            "Radio audio failed:",
                            error
                        );

                    }
                );
        }

        function toggleRadio() {

            enableSiteAudio();

            const days =
                getDaysRemaining();

            if (days <= 25) {

                disableRadio();

                return;
            }

            if (!radioOn) {

                radioOn = true;

                radioStatus.textContent =
                    "RECEIVING";

                radioImage.classList.add(
                    "radio-playing"
                );

                if (
                    radioAudio.src
                    &&
                    radioAudio.currentTime > 0
                ) {

                    radioAudio
                        .play()
                        .catch(() => {});

                } else {

                    randomSong();
                }

            } else {

                radioOn = false;

                radioAudio.pause();

                radioStatus.textContent =
                    "OFF";

                radioImage.classList.remove(
                    "radio-playing"
                );
            }
        }

        radioImage.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                toggleRadio();

            }
        );

        radioAudio.addEventListener(
            "ended",
            function() {

                if (
                    radioOn
                    &&
                    getDaysRemaining() > 25
                ) {

                    randomSong();
                }
            }
        );

        /* =========================
           DAY 25 RADIO SHUTDOWN
        ========================= */

        function checkRadioCountdown() {

            if (
                getDaysRemaining()
                <=
                25
            ) {

                disableRadio();
            }
        }

        function disableRadio() {

            radioOn = false;

            radioAudio.pause();

            radioStatus.textContent =
                "NO SIGNAL";

            radioImage.classList.remove(
                "radio-playing"
            );

            radioImage.classList.add(
                "radio-dead"
            );
        }

        checkRadioCountdown();

    </script>

</body>
</html>
