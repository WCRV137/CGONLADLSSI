<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CGONLADLSSI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #070707;
    color: #e8e4d6;

    overflow: hidden;

    font-family:
        "Courier New",
        monospace;
}


/* =========================================
   CENTER
========================================= */

#centerArea {

    position: fixed;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    z-index: 10;

}


/* =========================================
   STATUS LIGHT
========================================= */

#statusLight {

    width: 9px;
    height: 9px;

    margin:
        0 auto
        25px auto;

    border-radius: 50%;

    background: #a6c49a;

    box-shadow:
        0 0 8px
        rgba(166,196,154,0.7);

    animation:
        blink 2.5s infinite;

}


@keyframes blink {

    0% {
        opacity: 0.25;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.25;
    }

}


/* =========================================
   COUNTDOWN
========================================= */

#countdown {

    font-size:
        clamp(
            35px,
            7vw,
            85px
        );

    letter-spacing: 4px;

    white-space: nowrap;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.08);

}


/* =========================================
   DATE
========================================= */

#dateText {

    margin-top: 18px;

    font-size: 12px;

    letter-spacing: 6px;

    opacity: 0.38;

}


/* =========================================
   RANDOM MESSAGE
========================================= */

#message {

    margin-top: 30px;

    height: 20px;

    font-size: 11px;

    letter-spacing: 4px;

    opacity: 0;

    transition:
        opacity 0.8s ease;

}


#message.visible {

    opacity: 0.45;

}


/* =========================================
   RADIO
========================================= */

#radioArea {

    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 220px;

    text-align: center;

    z-index: 20;

    user-select: none;

}


#radioImage {

    width: 200px;

    max-width: 30vw;

    height: auto;

    cursor: pointer;

    transition:
        transform 0.15s,
        filter 0.3s;

}


#radioImage:hover {

    transform:
        scale(1.03);

}


#radioImage:active {

    transform:
        scale(0.96);

}


#radioImage.radio-playing {

    filter:

        brightness(1.15)

        drop-shadow(
            0 0 12px
            rgba(255,220,140,0.45)
        );

}


#radioImage.radio-dead {

    filter:

        grayscale(100%)

        brightness(0.5);

}


/* =========================================
   HIPPO
========================================= */

#hippoContainer {

    position: fixed;

    right: 20px;
    top: 20px;

    width: 190px;
    height: 230px;

    display: none;

    justify-content: center;
    align-items: flex-end;

    z-index: 50;

}


#hippo {

    width: 170px;
    height: auto;

    cursor: pointer;

    user-select: none;

    transform-origin:
        bottom center;

    filter:
        drop-shadow(
            0 6px 8px
            rgba(0,0,0,0.75)
        );

}


/* normal bouncing */

#hippo.bouncing {

    animation:
        hippoBounce
        0.5s
        infinite
        ease-in-out;

}


@keyframes hippoBounce {

    0% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-45px);

    }

    100% {

        transform:
            translateY(0);

    }

}


/* crazy bouncing */

#hippo.crazy {

    animation:
        hippoCrazy
        0.18s
        infinite
        ease-in-out;

}


@keyframes hippoCrazy {

    0% {

        transform:
            translateY(0)
            rotate(-4deg);

    }

    50% {

        transform:
            translateY(-65px)
            rotate(5deg);

    }

    100% {

        transform:
            translateY(0)
            rotate(-3deg);

    }

}


/* disappear */

#hippo.disappear {

    animation:
        hippoDisappear
        0.6s
        forwards;

}


@keyframes hippoDisappear {

    0% {

        opacity: 1;

        transform:
            scale(1);

    }

    100% {

        opacity: 0;

        transform:
            translateY(-100px)
            scale(0.2);

    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 650px) {

    #countdown {

        font-size: 27px;

    }


    #radioArea {

        width: 140px;

        right: 10px;
        bottom: 10px;

    }


    #radioImage {

        width: 130px;

    }


    #hippoContainer {

        width: 120px;
        height: 160px;

        right: 8px;
        top: 8px;

    }


    #hippo {

        width: 105px;

    }

}

</style>

</head>


<body>


<!-- =========================================
     CENTER
========================================= -->

<div id="centerArea">

    <div id="statusLight"></div>

    <div id="countdown">

        LOADING

    </div>

    <div id="dateText">

        12 / 25 / 1964

    </div>

    <div id="message"></div>

</div>



<!-- =========================================
     HIPPO
========================================= -->

<div id="hippoContainer">

    <img
        id="hippo"
        src="hippo.png"
        alt="Hippo"
        draggable="false"
    >

</div>



<!-- =========================================
     RADIO
========================================= -->

<div id="radioArea">

    <img
        src="radio.png"
        id="radioImage"
        alt="Radio"
        draggable="false"
    >

</div>



<!-- =========================================
     AUDIO
========================================= -->

<audio
    id="radioAudio"
    preload="metadata"
></audio>


<audio
    id="tickSound"
    src="tick.mp3"
    preload="auto"
></audio>


<audio
    id="tockSound"
    src="tock.mp3"
    preload="auto"
></audio>


<audio
    id="hippoMusic"
    src="hippo.wav"
    preload="auto"
></audio>



<script>

/* =========================================
   COUNTDOWN
========================================= */

const endDate =

    new Date(

        "2026-12-25T00:00:00-03:30"

    ).getTime();


const countdown =

    document.getElementById(
        "countdown"
    );


function getTimeRemaining() {

    return (

        endDate
        -
        Date.now()

    );

}


function getDaysRemaining() {

    return Math.floor(

        getTimeRemaining()

        /

        (
            1000 *
            60 *
            60 *
            24
        )

    );

}



/* =========================================
   UPDATE COUNTDOWN
========================================= */

function updateCountdown() {

    const distance =
        getTimeRemaining();


    if (distance <= 0) {

        countdown.textContent =
            "0D 00H 00M 00S";

        return;
    }


    const days =

        Math.floor(

            distance /

            (
                1000 *
                60 *
                60 *
                24
            )

        );


    const hours =

        Math.floor(

            distance /

            (
                1000 *
                60 *
                60
            )

        ) % 24;


    const minutes =

        Math.floor(

            distance /

            (
                1000 *
                60
            )

        ) % 60;


    const seconds =

        Math.floor(

            distance /
            1000

        ) % 60;


    countdown.textContent =

        days +

        "D " +

        String(hours)
            .padStart(2, "0") +

        "H " +

        String(minutes)
            .padStart(2, "0") +

        "M " +

        String(seconds)
            .padStart(2, "0") +

        "S";


    checkRadioCountdown();

}



/* =========================================
   TICK TOCK
========================================= */

const tickSound =
    document.getElementById(
        "tickSound"
    );


const tockSound =
    document.getElementById(
        "tockSound"
    );


tickSound.volume =
    0.15;


tockSound.volume =
    0.15;


let audioEnabled =
    false;


let tickNext =
    true;


function enableAudio() {

    audioEnabled =
        true;

}


function playTickTock() {

    if (!audioEnabled) {
        return;
    }


    if (
        getTimeRemaining()
        <=
        0
    ) {

        return;
    }


    if (tickNext) {

        tickSound.currentTime = 0;

        tickSound
            .play()
            .catch(() => {});

    }

    else {

        tockSound.currentTime = 0;

        tockSound
            .play()
            .catch(() => {});

    }


    tickNext =
        !tickNext;

}



updateCountdown();


setInterval(

    function() {

        updateCountdown();

        playTickTock();

    },

    1000

);


document.addEventListener(

    "pointerdown",

    enableAudio,

    {
        once: true
    }

);



/* =========================================
   RADIO
========================================= */

const radioAudio =
    document.getElementById(
        "radioAudio"
    );


const radioImage =
    document.getElementById(
        "radioImage"
    );


const songs = [

    "song1.mp3",
    "song2.mp3",
    "song3.mp3",
    "song4.mp3",
    "song5.mp3"

];


let radioOn =
    false;


let currentSong =
    "";


radioAudio.volume =
    0.30;


function randomSong() {

    if (
        songs.length === 0
    ) {

        return;
    }


    let song;


    do {

        song =

            songs[
                Math.floor(
                    Math.random()
                    *
                    songs.length
                )
            ];

    }

    while (

        song === currentSong

        &&

        songs.length > 1

    );


    currentSong =
        song;


    radioAudio.src =
        song;


    radioAudio
        .play()
        .catch(() => {});

}


function toggleRadio() {

    enableAudio();


    if (
        getDaysRemaining()
        <=
        25
    ) {

        disableRadio();

        return;
    }


    if (!radioOn) {

        radioOn =
            true;


        radioImage
            .classList
            .add(
                "radio-playing"
            );


        randomSong();

    }

    else {

        radioOn =
            false;


        radioAudio.pause();


        radioImage
            .classList
            .remove(
                "radio-playing"
            );

    }

}


radioImage.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();

        toggleRadio();

    }

);


radioAudio.addEventListener(

    "ended",

    function() {

        if (

            radioOn

            &&

            getDaysRemaining() > 25

        ) {

            randomSong();

        }

    }

);


function checkRadioCountdown() {

    if (
        getDaysRemaining()
        <=
        25
    ) {

        disableRadio();

    }

}


function disableRadio() {

    radioOn =
        false;


    radioAudio.pause();


    radioImage
        .classList
        .remove(
            "radio-playing"
        );


    radioImage
        .classList
        .add(
            "radio-dead"
        );

}



/* =========================================
   HIPPO EVENT
========================================= */

const hippoContainer =
    document.getElementById(
        "hippoContainer"
    );


const hippo =
    document.getElementById(
        "hippo"
    );


const hippoMusic =
    document.getElementById(
        "hippoMusic"
    );


let hippoStarted =
    false;


let hippoStage =
    0;


let hippoTimer =
    null;



/* =========================================
   TIME CHECK

   1:10 AM → 1:30 AM
   every day
========================================= */

function checkHippoTime() {

    const now =
        new Date();


    const hour =
        now.getHours();


    const minute =
        now.getMinutes();


    const isHippoTime =

        hour === 1

        &&

        minute >= 10

        &&

        minute <= 30;


    if (
        isHippoTime
        &&
        !hippoStarted
    ) {

        hippoContainer.style.display =
            "flex";

    }

    else if (
        !isHippoTime
        &&
        !hippoStarted
    ) {

        hippoContainer.style.display =
            "none";

    }

}



checkHippoTime();


setInterval(

    checkHippoTime,

    10000

);



/* =========================================
   CLICK HIPPO
========================================= */

hippo.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();


        if (hippoStarted) {
            return;
        }


        hippoStarted =
            true;


        hippoStage =
            0;


        hippo.classList.add(
            "bouncing"
        );


        hippoMusic.currentTime =
            0;


        hippoMusic.volume =
            0.70;


        /*
        Let playback rate affect
        the pitch.
        */

        hippoMusic.preservesPitch =
            false;


        if (
            "webkitPreservesPitch"
            in hippoMusic
        ) {

            hippoMusic.webkitPreservesPitch =
                false;

        }


        hippoMusic.playbackRate =
            1.0;


        hippoMusic
            .play()
            .catch(() => {});


        startHippoChaos();

    }

);



/* =========================================
   GET MORE OUT OF TUNE
========================================= */

function startHippoChaos() {

    hippoTimer =

        setInterval(

            function() {

                hippoStage++;


                /*
                Music gets more wrong.
                */

                hippoMusic.playbackRate +=
                    0.07;


                /*
                Switch to faster jumping.
                */

                if (
                    hippoStage >= 5
                ) {

                    hippo.classList.remove(
                        "bouncing"
                    );


                    hippo.classList.add(
                        "crazy"
                    );

                }


                /*
                Eventually disappear.
                */

                if (
                    hippoStage >= 12
                ) {

                    clearInterval(
                        hippoTimer
                    );


                    disappearHippo();

                }

            },

            850

        );

}



/* =========================================
   DISAPPEAR
========================================= */

function disappearHippo() {

    hippo.classList.remove(
        "bouncing"
    );


    hippo.classList.remove(
        "crazy"
    );


    hippo.classList.add(
        "disappear"
    );


    hippoMusic.playbackRate =
        1.9;


    setTimeout(

        function() {

            hippoMusic.pause();


            hippoContainer.style.display =
                "none";

        },

        600

    );

}



/* =========================================
   RANDOM MESSAGES
========================================= */

const message =
    document.getElementById(
        "message"
    );


const messages = [

    "STAY TUNED",

    "NO RESPONSE",

    "PLEASE WAIT",

    "DO NOT ADJUST",

    "RECEIVING",

    "..."

];


function showRandomMessage() {

    if (
        Math.random() > 0.50
    ) {

        return;

    }


    message.textContent =

        messages[
            Math.floor(
                Math.random()
                *
                messages.length
            )
        ];


    message.classList.add(
        "visible"
    );


    setTimeout(

        function() {

            message.classList.remove(
                "visible"
            );

        },

        2500

    );

}


setInterval(

    showRandomMessage,

    6000

);



/* =========================================
   START
========================================= */

checkRadioCountdown();

</script>


</body>

</html>
