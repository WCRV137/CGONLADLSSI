<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CGONLADLSSI</title>

    <style>

        /* =========================
           PAGE
        ========================= */

        body {
            margin: 0;
            min-height: 100vh;

            background: #080808;
            color: #e8e4d6;

            font-family: "Courier New", monospace;

            overflow: hidden;
        }


        /* =========================
           COUNTDOWN
        ========================= */

        .main {
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        #countdown {
            font-size: clamp(
                35px,
                7vw,
                85px
            );

            letter-spacing: 4px;
        }


        /* =========================
           RADIO IMAGE
        ========================= */

        .radio-image-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            text-align: center;

            user-select: none;
        }


        #radioImage {
            width: 220px;
            max-width: 35vw;

            height: auto;

            cursor: pointer;

            transition:
                transform 0.15s,
                filter 0.3s,
                opacity 0.3s;
        }


        #radioImage:hover {
            transform: scale(1.03);
        }


        #radioImage:active {
            transform: scale(0.96);
        }


        /* Radio is playing */

        #radioImage.radio-playing {
            filter:
                brightness(1.15)
                drop-shadow(
                    0 0 10px
                    rgba(255, 220, 150, 0.4)
                );
        }


        /* Radio stops at 25 days */

        #radioImage.radio-dead {
            filter:
                grayscale(100%)
                brightness(0.55);

            cursor: default;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #countdown {
                font-size: 30px;
            }


            .radio-image-container {
                right: 10px;
                bottom: 10px;
            }


            #radioImage {
                width: 140px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         COUNTDOWN
    ========================== -->

    <div class="main">

        <div id="countdown">
            LOADING
        </div>

    </div>



    <!-- =========================
         RADIO IMAGE
    ========================== -->

    <div class="radio-image-container">

        <img
            src="radio.png"
            id="radioImage"
            alt="Radio"
        >

    </div>



    <!-- =========================
         AUDIO
    ========================== -->


    <!-- Radio music -->

    <audio
        id="radioAudio"
        preload="metadata"
    ></audio>


    <!-- Tick sound -->

    <audio
        id="tickSound"
        src="tick.mp3"
        preload="auto"
    ></audio>


    <!-- Tock sound -->

    <audio
        id="tockSound"
        src="tock.mp3"
        preload="auto"
    ></audio>



    <script>

        /* =========================
           GLOBAL COUNTDOWN
        ========================= */


        /*
            Same countdown for everyone.

            Ends:
            December 25, 2026
            12:00 AM
            Newfoundland Time
        */


        const endDate = new Date(
            "2026-12-25T00:00:00-03:30"
        ).getTime();



        const countdownElement =
            document.getElementById(
                "countdown"
            );



        /* =========================
           TIME FUNCTIONS
        ========================= */


        function getTimeRemaining() {

            return endDate - Date.now();

        }


        function getDaysRemaining() {

            return Math.floor(

                getTimeRemaining()

                /

                (
                    1000 *
                    60 *
                    60 *
                    24
                )

            );

        }



        /* =========================
           UPDATE COUNTDOWN
        ========================= */


        function updateCountdown() {

            const distance =
                getTimeRemaining();


            /* Countdown finished */

            if (distance <= 0) {

                countdownElement.textContent =
                    "0D 00H 00M 00S";

                disableRadio();

                clockEnabled = false;

                return;
            }


            const days =
                Math.floor(

                    distance /

                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )

                );


            const hours =
                Math.floor(

                    distance /

                    (
                        1000 *
                        60 *
                        60
                    )

                ) % 24;


            const minutes =
                Math.floor(

                    distance /

                    (
                        1000 *
                        60
                    )

                ) % 60;


            const seconds =
                Math.floor(

                    distance /
                    1000

                ) % 60;



            countdownElement.textContent =

                days +

                "D " +

                String(hours)
                    .padStart(2, "0") +

                "H " +

                String(minutes)
                    .padStart(2, "0") +

                "M " +

                String(seconds)
                    .padStart(2, "0") +

                "S";


            checkRadioCountdown();

        }



        /* =========================
           TICK / TOCK
        ========================= */


        const tickSound =
            document.getElementById(
                "tickSound"
            );


        const tockSound =
            document.getElementById(
                "tockSound"
            );


        tickSound.volume = 0.18;
        tockSound.volume = 0.18;


        let tickNext = true;
        let clockEnabled = false;



        function playClockSound() {

            if (!clockEnabled) {
                return;
            }


            if (getTimeRemaining() <= 0) {
                return;
            }


            if (tickNext) {

                tickSound.currentTime = 0;

                tickSound
                    .play()
                    .catch(() => {});

            }

            else {

                tockSound.currentTime = 0;

                tockSound
                    .play()
                    .catch(() => {});

            }


            tickNext = !tickNext;

        }



        /* =========================
           TIMER LOOP
        ========================= */


        updateCountdown();


        setInterval(

            function() {

                updateCountdown();

                playClockSound();

            },

            1000

        );



        /* =========================
           ENABLE AUDIO
        ========================= */


        /*
            Browsers require the visitor
            to interact with the page
            before sound can play.

            Nothing appears on screen.
            Clicking anywhere silently
            enables tick/tock.
        */


        function enableSiteAudio() {

            if (clockEnabled) {
                return;
            }


            clockEnabled = true;

            playClockSound();

        }


        document.addEventListener(

            "click",

            enableSiteAudio,

            {
                once: true
            }

        );


        document.addEventListener(

            "keydown",

            enableSiteAudio,

            {
                once: true
            }

        );



        /* =========================
           RADIO
        ========================= */


        const radioAudio =
            document.getElementById(
                "radioAudio"
            );


        const radioImage =
            document.getElementById(
                "radioImage"
            );



        /* =========================
           SONGS
        ========================= */


        /*
            Put all of these MP3 files
            beside index.html.
        */


        const songs = [

            "song1.mp3",
            "song2.mp3",
            "song3.mp3",
            "song4.mp3",
            "song5.mp3"

        ];


        let radioOn = false;

        let currentSong = "";


        radioAudio.volume = 0.35;



        /* =========================
           RANDOM SONG
        ========================= */


        function randomSong() {

            if (songs.length === 0) {
                return;
            }


            let song;


            do {

                const randomIndex =
                    Math.floor(

                        Math.random() *
                        songs.length

                    );


                song =
                    songs[randomIndex];

            }

            while (

                song === currentSong

                &&

                songs.length > 1

            );


            currentSong = song;


            radioAudio.src = song;


            radioAudio
                .play()
                .catch(

                    function(error) {

                        console.log(
                            "Radio could not play:",
                            error
                        );

                    }

                );

        }



        /* =========================
           CLICK RADIO
        ========================= */


        function toggleRadio() {

            enableSiteAudio();


            /*
                Radio stops working
                once 25 days remain.
            */

            if (getDaysRemaining() <= 25) {

                disableRadio();

                return;
            }


            /* TURN ON */

            if (!radioOn) {

                radioOn = true;


                radioImage
                    .classList
                    .add(
                        "radio-playing"
                    );


                /*
                    Resume the current song
                    if it was paused.
                */

                if (

                    radioAudio.src

                    &&

                    radioAudio.currentTime > 0

                ) {

                    radioAudio
                        .play()
                        .catch(() => {});

                }

                else {

                    randomSong();

                }

            }


            /* TURN OFF */

            else {

                radioOn = false;


                radioAudio.pause();


                radioImage
                    .classList
                    .remove(
                        "radio-playing"
                    );

            }

        }



        radioImage.addEventListener(

            "click",

            function(event) {

                event.stopPropagation();

                toggleRadio();

            }

        );



        /* =========================
           SONG ENDS
        ========================= */


        radioAudio.addEventListener(

            "ended",

            function() {

                if (

                    radioOn

                    &&

                    getDaysRemaining() > 25

                ) {

                    randomSong();

                }

            }

        );



        /* =========================
           25 DAYS REMAINING
        ========================= */


        function checkRadioCountdown() {

            if (getDaysRemaining() <= 25) {

                disableRadio();

            }

        }



        function disableRadio() {

            radioOn = false;


            radioAudio.pause();


            radioImage
                .classList
                .remove(
                    "radio-playing"
                );


            radioImage
                .classList
                .add(
                    "radio-dead"
                );

        }



        checkRadioCountdown();

    </script>


</body>

</html>
