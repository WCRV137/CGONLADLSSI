<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CGONLADLSSI</title>


    <style>

        /* =====================================
           PAGE
        ===================================== */

        body {

            margin: 0;

            min-height: 100vh;

            background: #080808;

            color: #e8e4d6;

            font-family:
                "Courier New",
                monospace;

            overflow: hidden;

        }



        /* =====================================
           MAIN AREA
        ===================================== */

        .main {

            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }



        h1 {

            margin: 0;

            font-size: 18px;

            font-weight: normal;

            letter-spacing: 8px;

            opacity: 0.65;

        }



        /* =====================================
           COUNTDOWN
        ===================================== */

        #countdown {

            margin-top: 25px;

            font-size:
                clamp(
                    35px,
                    7vw,
                    85px
                );

            letter-spacing: 4px;

        }



        #broadcastStatus {

            margin-top: 20px;

            font-size: 11px;

            letter-spacing: 4px;

            opacity: 0.45;

        }



        #soundNotice {

            margin-top: 10px;

            font-size: 9px;

            letter-spacing: 2px;

            opacity: 0.35;

        }



        /* =====================================
           RADIO
        ===================================== */

        .radio-image-container {

            position: fixed;

            right: 20px;

            bottom: 20px;

            text-align: center;

            user-select: none;

        }



        #radioImage {

            width: 220px;

            max-width: 35vw;

            height: auto;

            cursor: pointer;


            transition:

                transform 0.15s,

                filter 0.3s,

                opacity 0.3s;

        }



        #radioImage:hover {

            transform:
                scale(1.03);

        }



        #radioImage:active {

            transform:
                scale(0.96);

        }



        /* =====================================
           RADIO ON
        ===================================== */

        #radioImage.radio-playing {

            filter:

                brightness(1.15)

                drop-shadow(
                    0 0 10px
                    rgba(
                        255,
                        220,
                        150,
                        0.4
                    )
                );

        }



        /* =====================================
           RADIO DEAD
        ===================================== */

        #radioImage.radio-dead {

            filter:

                grayscale(100%)

                brightness(0.55);


            cursor: default;

        }



        #radioStatus {

            margin-top: 5px;

            font-size: 9px;

            letter-spacing: 3px;

            color: #aaa;

            opacity: 0.8;

        }



        /* =====================================
           MOBILE
        ===================================== */

        @media (
            max-width: 600px
        ) {


            #countdown {

                font-size: 30px;

            }


            h1 {

                font-size: 13px;

            }


            .radio-image-container {

                right: 10px;

                bottom: 10px;

            }


            #radioImage {

                width: 140px;

            }

        }

    </style>

</head>



<body>


    <!-- =====================================
         MAIN PAGE
    ====================================== -->

    <div class="main">


        <h1>

            CGONLADLSSI

        </h1>



        <div id="countdown">

            LOADING

        </div>



        <div id="broadcastStatus">

            BROADCAST ACTIVE

        </div>



        <div id="soundNotice">

            CLICK ANYWHERE TO ENABLE AUDIO

        </div>


    </div>



    <!-- =====================================
         RADIO IMAGE
    ====================================== -->

    <div class="radio-image-container">


        <img

            src="radio.png"

            id="radioImage"

            alt="Radio"

        >



        <div id="radioStatus">

            OFF

        </div>


    </div>



    <!-- =====================================
         AUDIO FILES
    ====================================== -->


    <!-- RADIO MUSIC -->

    <audio

        id="radioAudio"

        preload="metadata"

    ></audio>



    <!-- TICK -->

    <audio

        id="tickSound"

        src="tick.mp3"

        preload="auto"

    ></audio>



    <!-- TOCK -->

    <audio

        id="tockSound"

        src="tock.mp3"

        preload="auto"

    ></audio>



    <script>


        /* =====================================
           GLOBAL COUNTDOWN
        ====================================== */


        /*
            SAME DATE FOR EVERYONE

            DECEMBER 25 2026
            12:00 AM

            NEWFOUNDLAND TIME
        */


        const endDate =

            new Date(

                "2026-12-25T00:00:00-03:30"

            ).getTime();



        /* =====================================
           ELEMENTS
        ====================================== */


        const countdownElement =

            document.getElementById(

                "countdown"

            );



        const broadcastStatus =

            document.getElementById(

                "broadcastStatus"

            );



        const soundNotice =

            document.getElementById(

                "soundNotice"

            );



        /* =====================================
           TIME FUNCTIONS
        ====================================== */


        function getTimeRemaining() {


            return (

                endDate

                -

                Date.now()

            );

        }



        function getDaysRemaining() {


            return Math.floor(

                getTimeRemaining()

                /

                (
                    1000
                    *
                    60
                    *
                    60
                    *
                    24
                )

            );

        }



        /* =====================================
           UPDATE COUNTDOWN
        ====================================== */


        function updateCountdown() {


            const distance =

                getTimeRemaining();



            /* TIMER FINISHED */


            if (

                distance <= 0

            ) {


                countdownElement.textContent =

                    "0D 00H 00M 00S";



                broadcastStatus.textContent =

                    "TRANSMISSION ENDED";



                disableRadio();



                clockEnabled = false;



                return;

            }



            /* DAYS */


            const days =

                Math.floor(

                    distance

                    /

                    (
                        1000
                        *
                        60
                        *
                        60
                        *
                        24
                    )

                );



            /* HOURS */


            const hours =

                Math.floor(

                    distance

                    /

                    (
                        1000
                        *
                        60
                        *
                        60
                    )

                )

                %

                24;



            /* MINUTES */


            const minutes =

                Math.floor(

                    distance

                    /

                    (
                        1000
                        *
                        60
                    )

                )

                %

                60;



            /* SECONDS */


            const seconds =

                Math.floor(

                    distance

                    /

                    1000

                )

                %

                60;



            countdownElement.textContent =


                days


                +


                "D "


                +


                String(hours)

                    .padStart(
                        2,
                        "0"
                    )


                +


                "H "


                +


                String(minutes)

                    .padStart(
                        2,
                        "0"
                    )


                +


                "M "


                +


                String(seconds)

                    .padStart(
                        2,
                        "0"
                    )


                +


                "S";



            checkRadioCountdown();

        }



        /* =====================================
           CLOCK AUDIO
        ====================================== */


        const tickSound =

            document.getElementById(

                "tickSound"

            );



        const tockSound =

            document.getElementById(

                "tockSound"

            );



        tickSound.volume = 0.18;


        tockSound.volume = 0.18;



        let tickNext = true;


        let clockEnabled = false;



        /* =====================================
           PLAY TICK / TOCK
        ====================================== */


        function playClockSound() {


            if (

                !clockEnabled

            ) {

                return;

            }



            if (

                getTimeRemaining()

                <=

                0

            ) {

                return;

            }



            if (

                tickNext

            ) {


                tickSound.currentTime = 0;


                tickSound

                    .play()

                    .catch(

                        () => {}

                    );


            }


            else {


                tockSound.currentTime = 0;


                tockSound

                    .play()

                    .catch(

                        () => {}

                    );

            }



            tickNext =

                !tickNext;

        }



        /* =====================================
           MAIN TIMER
        ====================================== */


        updateCountdown();



        setInterval(

            function() {


                updateCountdown();


                playClockSound();


            },

            1000

        );



        /* =====================================
           ENABLE AUDIO
        ====================================== */


        /*
            Browsers don't allow
            automatic sound.

            First click or key press
            activates the clock.
        */


        function enableSiteAudio() {


            if (

                clockEnabled

            ) {

                return;

            }



            clockEnabled = true;



            soundNotice.textContent =

                "AUDIO ENABLED";



            playClockSound();

        }



        document.addEventListener(

            "click",

            enableSiteAudio,

            {
                once: true
            }

        );



        document.addEventListener(

            "keydown",

            enableSiteAudio,

            {
                once: true
            }

        );



        /* =====================================
           RADIO
        ====================================== */


        const radioAudio =

            document.getElementById(

                "radioAudio"

            );



        const radioImage =

            document.getElementById(

                "radioImage"

            );



        const radioStatus =

            document.getElementById(

                "radioStatus"

            );



        /* =====================================
           SONG LIST
        ====================================== */


        /*
            ALL SONGS ARE IN THE
            SAME PLACE AS INDEX.HTML
        */


        const songs = [


            "song1.mp3",


            "song2.mp3",


            "song3.mp3",


            "song4.mp3",


            "song5.mp3"


        ];



        let radioOn = false;


        let currentSong = "";



        radioAudio.volume = 0.35;



        /* =====================================
           RANDOM SONG
        ====================================== */


        function randomSong() {


            if (

                songs.length === 0

            ) {

                return;

            }



            let song;



            do {


                const randomIndex =

                    Math.floor(

                        Math.random()

                        *

                        songs.length

                    );



                song =

                    songs[
                        randomIndex
                    ];


            }


            while (


                song === currentSong


                &&


                songs.length > 1


            );



            currentSong = song;



            radioAudio.src = song;



            radioAudio

                .play()

                .catch(

                    function(error) {


                        console.log(

                            "Radio could not play:",

                            error

                        );


                    }

                );

        }



        /* =====================================
           RADIO BUTTON
        ====================================== */


        function toggleRadio() {


            enableSiteAudio();



            /*
                RADIO STOPS WORKING
                AT 25 DAYS
            */


            if (

                getDaysRemaining()

                <=

                25

            ) {


                disableRadio();


                return;

            }



            /* TURN RADIO ON */


            if (

                !radioOn

            ) {


                radioOn = true;



                radioStatus.textContent =

                    "RECEIVING";



                radioImage

                    .classList

                    .add(

                        "radio-playing"

                    );



                /* Resume paused song */


                if (


                    radioAudio.src


                    &&


                    radioAudio.currentTime > 0


                ) {


                    radioAudio

                        .play()

                        .catch(

                            () => {}

                        );


                }


                else {


                    randomSong();


                }

            }



            /* TURN RADIO OFF */


            else {


                radioOn = false;



                radioAudio.pause();



                radioStatus.textContent =

                    "OFF";



                radioImage

                    .classList

                    .remove(

                        "radio-playing"

                    );

            }

        }



        /* =====================================
           CLICK RADIO IMAGE
        ====================================== */


        radioImage.addEventListener(

            "click",

            function(event) {


                event.stopPropagation();


                toggleRadio();


            }

        );



        /* =====================================
           SONG FINISHED
        ====================================== */


        radioAudio.addEventListener(

            "ended",

            function() {


                if (


                    radioOn


                    &&


                    getDaysRemaining()

                    >

                    25


                ) {


                    randomSong();


                }

            }

        );



        /* =====================================
           DAY 25
        ====================================== */


        function checkRadioCountdown() {


            if (


                getDaysRemaining()

                <=

                25


            ) {


                disableRadio();


            }

        }



        /* =====================================
           DISABLE RADIO
        ====================================== */


        function disableRadio() {


            radioOn = false;



            radioAudio.pause();



            radioStatus.textContent =

                "NO SIGNAL";



            radioImage

                .classList

                .remove(

                    "radio-playing"

                );



            radioImage

                .classList

                .add(

                    "radio-dead"

                );

        }



        /* =====================================
           INITIAL RADIO CHECK
        ====================================== */


        checkRadioCountdown();


    </script>


</body>

</html>
