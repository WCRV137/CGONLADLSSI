<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGONLADLSSI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #070707;
    color: #e8e4d6;
    overflow: hidden;
    font-family: "Courier New", monospace;
}


/* =========================================
   CENTER
========================================= */

#centerArea {
    position: fixed;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
}

#statusLight {
    width: 9px;
    height: 9px;
    margin: 0 auto 25px auto;

    border-radius: 50%;

    background: #a6c49a;

    box-shadow:
        0 0 8px
        rgba(166,196,154,0.7);

    animation:
        statusBlink
        2.5s
        infinite;
}

@keyframes statusBlink {

    0%,
    100% {
        opacity: 0.25;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================
   CHRISTMAS COUNTDOWN
========================================= */

#countdown {
    font-size: clamp(35px, 7vw, 85px);
    letter-spacing: 4px;
    white-space: nowrap;
}

#dateText {
    margin-top: 18px;

    font-size: 12px;
    letter-spacing: 6px;

    opacity: 0.38;
}

#message {
    margin-top: 30px;

    min-height: 20px;

    font-size: 11px;
    letter-spacing: 4px;

    opacity: 0;

    transition:
        opacity 0.8s;
}

#message.visible {
    opacity: 0.45;
}


/* =========================================
   RADIO
========================================= */

#radioArea {
    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 220px;

    text-align: center;

    z-index: 20;

    user-select: none;
}

#radioImage {
    width: 200px;
    height: auto;

    cursor: pointer;

    transition:
        transform 0.15s,
        filter 0.15s;
}

#radioImage:hover {
    transform:
        scale(1.03);
}

#radioImage:active {
    transform:
        scale(0.96);
}

#radioImage.radio-playing {
    filter:
        brightness(1.15)
        drop-shadow(
            0 0 12px
            rgba(255,220,140,0.45)
        );
}


/* =========================================
   RADIO GLITCH
========================================= */

#radioArea.event-glitch {
    animation:
        radioGlitch
        0.14s
        infinite;
}

@keyframes radioGlitch {

    0% {
        transform:
            translate(0,0);
    }

    20% {
        transform:
            translate(-2px,1px)
            skewX(1deg);
    }

    40% {
        transform:
            translate(3px,-2px)
            skewX(-2deg);
    }

    60% {
        transform:
            translate(-3px,2px);
    }

    80% {
        transform:
            translate(2px,-1px)
            skewX(2deg);
    }

    100% {
        transform:
            translate(0,0);
    }
}

#radioArea.big-glitch {
    filter:
        contrast(2.5)
        brightness(1.6);

    transform:
        translate(8px,-4px)
        skewX(7deg);
}


/* =========================================
   RADIO HIT
========================================= */

#radioArea.hit {
    animation:
        radioHit
        0.65s
        ease-in
        forwards;
}

@keyframes radioHit {

    0% {
        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg);
    }

    25% {
        transform:
            translate(-25px,10px)
            rotate(-15deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(600px,180px)
            rotate(85deg);
    }
}

#radioArea.gone {
    display: none;
}


/* =========================================
   TV
========================================= */

#tvArea {
    position: fixed;

    right: 20px;
    bottom: 20px;

    width: 240px;
    height: 200px;

    display: none;

    z-index: 60;

    pointer-events: none;

    transform:
        translateY(-900px);
}


/* STATIC GIF INSIDE TV */

#tvStaticGif {
    position: absolute;

    /*
    Adjust these four numbers if
    static.gif doesn't line up
    with the screen in tv.png.
    */

    left: 37px;
    top: 34px;

    width: 165px;
    height: 115px;

    object-fit: cover;

    z-index: 1;

    pointer-events: none;
}


/* TV FRAME */

#tvImage {
    position: absolute;

    left: 0;
    top: 0;

    width: 240px;
    height: auto;

    z-index: 2;

    pointer-events: none;
}


/* TV FALL */

#tvArea.falling {
    display: block;

    animation:
        tvFall
        1.15s
        cubic-bezier(
            0.7,
            0,
            0.9,
            1
        )
        forwards;
}

@keyframes tvFall {

    0% {
        transform:
            translateY(-900px)
            rotate(-10deg);
    }

    65% {
        transform:
            translateY(-50px)
            rotate(5deg);
    }

    83% {
        transform:
            translateY(12px)
            rotate(-3deg);
    }

    92% {
        transform:
            translateY(-5px)
            rotate(2deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }
}


/* TV STAYS */

#tvArea.finished {
    display: block;

    transform:
        translateY(0);
}


/* =========================================
   HIPPO
========================================= */

#hippoContainer {
    position: fixed;

    right: 20px;
    top: 20px;

    width: 190px;
    height: 230px;

    display: none;

    justify-content: center;
    align-items: flex-end;

    z-index: 80;
}

#hippo {
    width: 170px;
    height: auto;

    cursor: pointer;

    user-select: none;

    transform-origin:
        bottom center;
}

#hippo.bouncing {
    animation:
        hippoBounce
        0.5s
        infinite
        ease-in-out;
}

@keyframes hippoBounce {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-45px);
    }
}

#hippo.crazy {
    animation:
        hippoCrazy
        0.18s
        infinite;
}

@keyframes hippoCrazy {

    0% {
        transform:
            translateY(0)
            rotate(-4deg);
    }

    50% {
        transform:
            translateY(-65px)
            rotate(5deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(-3deg);
    }
}

#hippo.disappear {
    animation:
        hippoDisappear
        0.6s
        forwards;
}

@keyframes hippoDisappear {

    0% {
        opacity: 1;

        transform:
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-100px)
            scale(0.2);
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 650px) {

    #countdown {
        font-size: 27px;
    }

    #radioArea {
        right: 10px;
        bottom: 10px;
        width: 140px;
    }

    #radioImage {
        width: 130px;
    }
}

</style>
</head>


<body>


<!-- ======================================
     MAIN
====================================== -->

<div id="centerArea">

    <div id="statusLight"></div>

    <div id="countdown">
        LOADING
    </div>

    <div id="dateText">
        12 / 25 / 2026
    </div>

    <div id="message"></div>

</div>


<!-- ======================================
     HIPPO
====================================== -->

<div id="hippoContainer">

    <img
        id="hippo"
        src="hippo.png"
        alt=""
        draggable="false"
    >

</div>


<!-- ======================================
     RADIO
====================================== -->

<div id="radioArea">

    <img
        id="radioImage"
        src="radio.png"
        alt="Radio"
        draggable="false"
    >

</div>


<!-- ======================================
     TV
====================================== -->

<div id="tvArea">

    <!-- animated static -->
    <img
        id="tvStaticGif"
        src="static.gif"
        alt=""
        draggable="false"
    >

    <!-- TV frame -->
    <img
        id="tvImage"
        src="tv.png"
        alt="TV"
        draggable="false"
    >

</div>


<!-- ======================================
     AUDIO
====================================== -->

<audio
    id="radioAudio"
    preload="metadata"
></audio>

<audio
    id="tickSound"
    src="tick.mp3"
    preload="auto"
></audio>

<audio
    id="tockSound"
    src="tock.mp3"
    preload="auto"
></audio>

<audio
    id="hippoMusic"
    src="hippo.wav"
    preload="auto"
></audio>

<audio
    id="glitch1"
    src="glitch1.wav"
    preload="auto"
></audio>

<audio
    id="glitch2"
    src="glitch2.wav"
    preload="auto"
></audio>

<audio
    id="glitch3"
    src="glitch3.wav"
    preload="auto"
></audio>

<audio
    id="impactSound"
    src="impact.wav"
    preload="auto"
></audio>

<audio
    id="staticMusic"
    src="staticmusic.wav"
    preload="auto"
    loop
></audio>


<script>

/* =========================================
   CHRISTMAS COUNTDOWN
========================================= */

const CHRISTMAS_TIME =
    new Date(
        "2026-12-25T00:00:00-03:30"
    ).getTime();


const countdown =
    document.getElementById(
        "countdown"
    );


function updateCountdown() {

    const distance =
        CHRISTMAS_TIME -
        Date.now();


    if (distance <= 0) {

        countdown.textContent =
            "0D 00H 00M 00S";

        return;
    }


    const days =
        Math.floor(
            distance /
            86400000
        );


    const hours =
        Math.floor(
            distance /
            3600000
        ) % 24;


    const minutes =
        Math.floor(
            distance /
            60000
        ) % 60;


    const seconds =
        Math.floor(
            distance /
            1000
        ) % 60;


    countdown.textContent =

        days +

        "D " +

        String(hours)
            .padStart(2,"0") +

        "H " +

        String(minutes)
            .padStart(2,"0") +

        "M " +

        String(seconds)
            .padStart(2,"0") +

        "S";

}


/* =========================================
   REAL EVENT

   AUGUST 17 2026
   8:30 PM NEWFOUNDLAND

   Newfoundland daylight time
   = UTC -02:30
========================================= */

const EVENT_TIME =
    new Date(
        "2026-08-17T20:30:00-02:30"
    ).getTime();


/* 10 minutes */

const EVENT_DURATION =
    10 * 60 * 1000;


/* =========================================
   SAVE KEYS
========================================= */

const EVENT_STARTED_KEY =
    "CGONLADLSSI_830_STARTED_V2";

const EVENT_START_TIME_KEY =
    "CGONLADLSSI_830_START_V2";

const EVENT_FINISHED_KEY =
    "CGONLADLSSI_830_FINISHED_V2";


/* =========================================
   ELEMENTS
========================================= */

const radioArea =
    document.getElementById(
        "radioArea"
    );

const radioImage =
    document.getElementById(
        "radioImage"
    );

const radioAudio =
    document.getElementById(
        "radioAudio"
    );

const tvArea =
    document.getElementById(
        "tvArea"
    );

const staticMusic =
    document.getElementById(
        "staticMusic"
    );

const impactSound =
    document.getElementById(
        "impactSound"
    );

const tickSound =
    document.getElementById(
        "tickSound"
    );

const tockSound =
    document.getElementById(
        "tockSound"
    );


/* =========================================
   AUDIO UNLOCK
========================================= */

let audioUnlocked =
    false;


function unlockAudio() {

    audioUnlocked =
        true;


    /*
    If event already ended,
    clicking anywhere starts
    TV static music.
    */

    if (
        localStorage.getItem(
            EVENT_FINISHED_KEY
        ) === "yes"
    ) {

        startStaticMusic();
    }


    /*
    Event currently running.
    */

    if (
        specialEventRunning &&
        radioAudio.paused
    ) {

        if (!radioOn) {
            radioOn = true;
        }

        randomSong();
    }

}


document.addEventListener(
    "pointerdown",
    unlockAudio,
    {
        once: true
    }
);


document.addEventListener(
    "keydown",
    unlockAudio,
    {
        once: true
    }
);


/* =========================================
   TICK / TOCK
========================================= */

tickSound.volume =
    0.15;

tockSound.volume =
    0.15;


let tickNext =
    true;


function playTickTock() {

    if (!audioUnlocked) {
        return;
    }


    const sound =
        tickNext
            ? tickSound
            : tockSound;


    sound.currentTime =
        0;


    sound
        .play()
        .catch(() => {});


    tickNext =
        !tickNext;

}


/* =========================================
   RADIO SONGS
========================================= */

const songs = [

    "song1.mp3",
    "song2.mp3",
    "song3.mp3",
    "song4.mp3",
    "song5.mp3"

];


let radioOn =
    false;


let currentSong =
    "";


radioAudio.volume =
    0.30;


function randomSong() {

    let song;


    do {

        song =
            songs[
                Math.floor(
                    Math.random() *
                    songs.length
                )
            ];

    }

    while (
        song === currentSong &&
        songs.length > 1
    );


    currentSong =
        song;


    radioAudio.src =
        song;


    radioAudio.volume =
        0.30;


    radioAudio.playbackRate =
        1;


    radioAudio
        .play()
        .catch(() => {});

}


/* =========================================
   RADIO CLICK
========================================= */

function toggleRadio() {

    if (specialEventRunning) {
        return;
    }


    if (
        localStorage.getItem(
            EVENT_FINISHED_KEY
        ) === "yes"
    ) {

        return;
    }


    if (!radioOn) {

        radioOn =
            true;


        radioImage.classList.add(
            "radio-playing"
        );


        randomSong();

    }

    else {

        radioOn =
            false;


        radioAudio.pause();


        radioImage.classList.remove(
            "radio-playing"
        );

    }

}


radioImage.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();


        audioUnlocked =
            true;


        toggleRadio();

    }

);


radioAudio.addEventListener(

    "ended",

    function() {

        if (
            radioOn &&
            !localStorage.getItem(
                EVENT_FINISHED_KEY
            )
        ) {

            randomSong();

        }

    }

);


/* =========================================
   STATIC MUSIC
========================================= */

function startStaticMusic() {

    if (!audioUnlocked) {
        return;
    }


    /*
    Stop normal radio.
    */

    radioAudio.pause();


    staticMusic.volume =
        0.35;


    staticMusic.loop =
        true;


    staticMusic
        .play()
        .catch(() => {});

}


/* =========================================
   RANDOM MESSAGES
========================================= */

const message =
    document.getElementById(
        "message"
    );


const messages = [

    "STAY TUNED",

    "NO RESPONSE",

    "PLEASE WAIT",

    "DO NOT ADJUST",

    "RECEIVING",

    "..."

];


function showRandomMessage() {

    if (
        Math.random() >
        0.50
    ) {

        return;
    }


    message.textContent =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];


    message.classList.add(
        "visible"
    );


    setTimeout(

        function() {

            message.classList.remove(
                "visible"
            );

        },

        2500

    );

}


/* =========================================
   HIPPO
========================================= */

const hippoContainer =
    document.getElementById(
        "hippoContainer"
    );

const hippo =
    document.getElementById(
        "hippo"
    );

const hippoMusic =
    document.getElementById(
        "hippoMusic"
    );


let hippoStarted =
    false;


let hippoStage =
    0;


let hippoTimer =
    null;


/*
1:10 AM - 1:30 AM
*/

function checkHippoTime() {

    const now =
        new Date();


    const allowed =

        now.getHours() === 1

        &&

        now.getMinutes() >= 10

        &&

        now.getMinutes() <= 30;


    if (
        allowed &&
        !hippoStarted
    ) {

        hippoContainer.style.display =
            "flex";

    }

    else if (
        !allowed &&
        !hippoStarted
    ) {

        hippoContainer.style.display =
            "none";

    }

}


hippo.addEventListener(

    "click",

    function(event) {

        event.stopPropagation();


        if (hippoStarted) {
            return;
        }


        hippoStarted =
            true;


        hippoStage =
            0;


        hippo.classList.add(
            "bouncing"
        );


        hippoMusic.currentTime =
            0;


        hippoMusic.volume =
            0.70;


        hippoMusic.preservesPitch =
            false;


        hippoMusic.playbackRate =
            1;


        hippoMusic
            .play()
            .catch(() => {});


        hippoTimer =
            setInterval(

                function() {

                    hippoStage++;


                    hippoMusic.playbackRate +=
                        0.07;


                    if (
                        hippoStage >= 5
                    ) {

                        hippo.classList.remove(
                            "bouncing"
                        );


                        hippo.classList.add(
                            "crazy"
                        );

                    }


                    if (
                        hippoStage >= 12
                    ) {

                        clearInterval(
                            hippoTimer
                        );


                        hippo.classList.remove(
                            "crazy"
                        );


                        hippo.classList.add(
                            "disappear"
                        );


                        setTimeout(

                            function() {

                                hippoMusic.pause();


                                hippoContainer.style.display =
                                    "none";

                            },

                            600

                        );

                    }

                },

                850

            );

    }

);


/* =========================================
   GLITCH AUDIO
========================================= */

const glitchSounds = [

    document.getElementById(
        "glitch1"
    ),

    document.getElementById(
        "glitch2"
    ),

    document.getElementById(
        "glitch3"
    )

];


/* =========================================
   EVENT STATE
========================================= */

let specialEventRunning =
    false;


let televisionDropping =
    false;


let songGlitchTimer =
    null;


let glitchSoundTimer =
    null;


let visualGlitchTimer =
    null;


let eventEndTimer =
    null;


/* =========================================
   EVENT PROGRESS
========================================= */

function getEventProgress() {

    const start =
        Number(
            localStorage.getItem(
                EVENT_START_TIME_KEY
            )
        );


    if (!start) {
        return 0;
    }


    return Math.min(

        1,

        Math.max(

            0,

            (
                Date.now() -
                start
            )

            /

            EVENT_DURATION

        )

    );

}


/* =========================================
   SETUP EVENT
========================================= */

function setupGlobalEvent() {

    /*
    Already happened.
    */

    if (
        localStorage.getItem(
            EVENT_FINISHED_KEY
        ) === "yes"
    ) {

        showPermanentTV();

        return;
    }


    /*
    Was running before refresh.
    */

    if (
        localStorage.getItem(
            EVENT_STARTED_KEY
        ) === "yes"
    ) {

        resumeSpecialEvent();

        return;
    }


    const now =
        Date.now();


    /*
    BEFORE 8:30
    */

    if (
        now <
        EVENT_TIME
    ) {

        setTimeout(

            startSpecialEvent,

            EVENT_TIME -
            now

        );


        return;
    }


    /*
    8:30 - 8:40

    Join event at correct point.
    */

    if (

        now >= EVENT_TIME

        &&

        now <
        EVENT_TIME +
        EVENT_DURATION

    ) {

        localStorage.setItem(
            EVENT_STARTED_KEY,
            "yes"
        );


        localStorage.setItem(
            EVENT_START_TIME_KEY,
            String(EVENT_TIME)
        );


        resumeSpecialEvent();


        return;
    }


    /*
    AFTER 8:40

    Show final TV state.
    */

    if (
        now >=
        EVENT_TIME +
        EVENT_DURATION
    ) {

        localStorage.setItem(
            EVENT_FINISHED_KEY,
            "yes"
        );


        showPermanentTV();

    }

}


/* =========================================
   START EVENT
========================================= */

function startSpecialEvent() {

    if (specialEventRunning) {
        return;
    }


    specialEventRunning =
        true;


    localStorage.setItem(
        EVENT_STARTED_KEY,
        "yes"
    );


    localStorage.setItem(
        EVENT_START_TIME_KEY,
        String(EVENT_TIME)
    );


    beginGlitchSequence();


    const elapsed =
        Date.now() -
        EVENT_TIME;


    eventEndTimer =
        setTimeout(

            dropTelevision,

            Math.max(
                0,
                EVENT_DURATION -
                elapsed
            )

        );

}


/* =========================================
   RESUME EVENT
========================================= */

function resumeSpecialEvent() {

    if (specialEventRunning) {
        return;
    }


    const start =
        Number(
            localStorage.getItem(
                EVENT_START_TIME_KEY
            )
        );


    if (!start) {
        return;
    }


    const elapsed =
        Date.now() -
        start;


    if (
        elapsed >=
        EVENT_DURATION
    ) {

        dropTelevision();

        return;
    }


    specialEventRunning =
        true;


    beginGlitchSequence();


    eventEndTimer =
        setTimeout(

            dropTelevision,

            EVENT_DURATION -
            elapsed

        );

}


/* =========================================
   BEGIN CORRUPTION
========================================= */

function beginGlitchSequence() {

    radioArea.classList.add(
        "event-glitch"
    );


    /*
    Radio turns itself on.
    */

    radioOn =
        true;


    radioImage.classList.add(
        "radio-playing"
    );


    if (
        audioUnlocked &&
        radioAudio.paused
    ) {

        randomSong();

    }


    scheduleSongGlitch();

    scheduleGlitchSound();

    scheduleVisualGlitch();

}


/* =========================================
   SONG GLITCH SCHEDULER
========================================= */

function scheduleSongGlitch() {

    if (!specialEventRunning) {
        return;
    }


    const progress =
        getEventProgress();


    /*
    Early = rare
    Late = extremely frequent
    */

    const minimum =
        4000 -
        progress * 3850;


    const randomRange =
        3000 -
        progress * 2600;


    const delay =
        Math.max(

            150,

            minimum +

            Math.random() *
            randomRange

        );


    songGlitchTimer =
        setTimeout(

            function() {

                if (!specialEventRunning) {
                    return;
                }


                glitchCurrentSong();


                /*
                Double glitch near end.
                */

                if (

                    progress > 0.70

                    &&

                    Math.random() <
                    progress * 0.55

                ) {

                    setTimeout(

                        glitchCurrentSong,

                        80 +
                        Math.random() *
                        180

                    );

                }


                scheduleSongGlitch();

            },

            delay

        );

}


/* =========================================
   ACTUAL SONG GLITCH
========================================= */

function glitchCurrentSong() {

    if (!specialEventRunning) {
        return;
    }


    const progress =
        getEventProgress();


    const type =
        Math.floor(
            Math.random() *
            6
        );


    /*
    1 — SILENCE
    */

    if (type === 0) {

        const oldVolume =
            radioAudio.volume;


        radioAudio.volume =
            0;


        setTimeout(

            function() {

                if (specialEventRunning) {

                    radioAudio.volume =
                        oldVolume;

                }

            },

            80 +

            Math.random() *
            (
                200 +
                progress * 1100
            )

        );

    }


    /*
    2 — SKIP
    */

    else if (type === 1) {

        if (

            Number.isFinite(
                radioAudio.duration
            )

            &&

            radioAudio.duration >
            2

        ) {

            const amount =

                (
                    -2 +
                    Math.random() *
                    5
                )

                *

                (
                    1 +
                    progress *
                    3
                );


            radioAudio.currentTime =

                Math.max(

                    0,

                    Math.min(

                        radioAudio.duration -
                        0.2,

                        radioAudio.currentTime +
                        amount

                    )

                );

        }

    }


    /*
    3 — SPEED / PITCH
    */

    else if (type === 2) {

        radioAudio.preservesPitch =
            false;


        if (
            "webkitPreservesPitch"
            in radioAudio
        ) {

            radioAudio.webkitPreservesPitch =
                false;

        }


        radioAudio.playbackRate =

            0.60 +

            Math.random() *
            (
                0.8 +
                progress
            );


        setTimeout(

            function() {

                radioAudio.playbackRate =
                    1;

            },

            100 +
            Math.random() *
            500

        );

    }


    /*
    4 — STUTTER
    */

    else if (type === 3) {

        const savedTime =
            radioAudio.currentTime;


        const repeats =

            2 +

            Math.floor(
                progress *
                14
            );


        let count =
            0;


        const speed =

            Math.max(

                30,

                120 -
                progress *
                90

            );


        const timer =
            setInterval(

                function() {

                    if (

                        !specialEventRunning

                        ||

                        count >=
                        repeats

                    ) {

                        clearInterval(
                            timer
                        );


                        return;
                    }


                    radioAudio.currentTime =
                        savedTime;


                    count++;

                },

                speed

            );

    }


    /*
    5 — RANDOM SONG SWITCH
    */

    else if (type === 4) {

        if (

            Math.random() <

            (
                0.15 +
                progress *
                0.55
            )

        ) {

            randomSong();

        }

    }


    /*
    6 — HARD CUT
    */

    else {

        radioAudio.pause();


        setTimeout(

            function() {

                if (

                    specialEventRunning

                    &&

                    audioUnlocked

                ) {

                    radioAudio
                        .play()
                        .catch(
                            () => {}
                        );

                }

            },

            80 +

            Math.random() *
            (
                250 +
                progress *
                700
            )

        );

    }

}


/* =========================================
   GLITCH WAV
========================================= */

function playRandomGlitchSound() {

    if (!audioUnlocked) {
        return;
    }


    const sound =
        glitchSounds[
            Math.floor(
                Math.random() *
                glitchSounds.length
            )
        ];


    sound.pause();


    sound.currentTime =
        0;


    sound.volume =

        0.12 +

        Math.random() *
        0.38;


    sound.preservesPitch =
        false;


    sound.playbackRate =

        0.65 +

        Math.random();


    sound
        .play()
        .catch(() => {});

}


/* =========================================
   GLITCH WAV SCHEDULER
========================================= */

function scheduleGlitchSound() {

    if (!specialEventRunning) {
        return;
    }


    const progress =
        getEventProgress();


    const delay =

        Math.max(

            250,

            4000 -

            progress *
            3600 +

            Math.random() *
            (
                2000 -
                progress *
                1400
            )

        );


    glitchSoundTimer =
        setTimeout(

            function() {

                if (!specialEventRunning) {
                    return;
                }


                playRandomGlitchSound();


                if (

                    progress > 0.75

                    &&

                    Math.random() <
                    0.45

                ) {

                    setTimeout(

                        playRandomGlitchSound,

                        100 +
                        Math.random() *
                        250

                    );

                }


                scheduleGlitchSound();

            },

            delay

        );

}


/* =========================================
   VISUAL GLITCH
========================================= */

function scheduleVisualGlitch() {

    if (!specialEventRunning) {
        return;
    }


    const progress =
        getEventProgress();


    const delay =

        Math.max(

            120,

            4500 -

            progress *
            4300 +

            Math.random() *
            (
                2500 -
                progress *
                2200
            )

        );


    visualGlitchTimer =
        setTimeout(

            function() {

                if (!specialEventRunning) {
                    return;
                }


                radioArea.classList.add(
                    "big-glitch"
                );


                const duration =

                    60 +

                    progress *
                    400 +

                    Math.random() *
                    160;


                setTimeout(

                    function() {

                        radioArea.classList.remove(
                            "big-glitch"
                        );

                    },

                    duration

                );


                scheduleVisualGlitch();

            },

            delay

        );

}


/* =========================================
   STOP CORRUPTION
========================================= */

function stopGlitches() {

    clearTimeout(
        songGlitchTimer
    );


    clearTimeout(
        glitchSoundTimer
    );


    clearTimeout(
        visualGlitchTimer
    );


    radioArea.classList.remove(
        "event-glitch"
    );


    radioArea.classList.remove(
        "big-glitch"
    );


    glitchSounds.forEach(

        function(sound) {

            sound.pause();

        }

    );


    radioAudio.volume =
        0.30;


    radioAudio.playbackRate =
        1;

}


/* =========================================
   TV FALL
========================================= */

function dropTelevision() {

    if (televisionDropping) {
        return;
    }


    televisionDropping =
        true;


    specialEventRunning =
        false;


    stopGlitches();


    /*
    RADIO DIES
    */

    radioAudio.pause();


    radioOn =
        false;


    radioImage.classList.remove(
        "radio-playing"
    );


    /*
    TV FALLS.

    static.gif is already inside it.
    */

    tvArea.classList.add(
        "falling"
    );


    /*
    IMPACT
    */

    setTimeout(

        function() {

            if (audioUnlocked) {

                impactSound.currentTime =
                    0;


                impactSound.volume =
                    0.75;


                impactSound
                    .play()
                    .catch(
                        () => {}
                    );

            }


            radioArea.classList.add(
                "hit"
            );

        },

        900

    );


    /*
    FINISH
    */

    setTimeout(

        finishSpecialEvent,

        1600

    );

}


/* =========================================
   FINAL TV
========================================= */

function finishSpecialEvent() {

    radioArea.classList.remove(
        "hit"
    );


    radioArea.classList.add(
        "gone"
    );


    tvArea.classList.remove(
        "falling"
    );


    tvArea.classList.add(
        "finished"
    );


    /*
    START STATIC MUSIC
    */

    startStaticMusic();


    localStorage.setItem(
        EVENT_FINISHED_KEY,
        "yes"
    );


    localStorage.removeItem(
        EVENT_STARTED_KEY
    );


    localStorage.removeItem(
        EVENT_START_TIME_KEY
    );


    televisionDropping =
        false;

}


/* =========================================
   USER LOADS AFTER EVENT
========================================= */

function showPermanentTV() {

    radioAudio.pause();


    radioArea.classList.add(
        "gone"
    );


    tvArea.classList.add(
        "finished"
    );


    /*
    Browser may block this until
    first click. unlockAudio()
    handles that case.
    */

    startStaticMusic();

}


/* =========================================
   START PAGE
========================================= */

updateCountdown();


checkHippoTime();


setupGlobalEvent();


setInterval(

    function() {

        updateCountdown();

        playTickTock();

    },

    1000

);


setInterval(

    checkHippoTime,

    10000

);


setInterval(

    showRandomMessage,

    6000

);

</script>
