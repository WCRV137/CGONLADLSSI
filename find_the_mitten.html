<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transmission</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: black;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* ========================================
   WHOLE GAME
======================================== */

#layout {
    position: relative;

    width: 960px;
    height: 540px;

    display: flex;

    overflow: hidden;

    background: black;
}


/* ========================================
   LEFT GAME
   640 x 540
======================================== */

#gameSide {
    position: relative;

    width: 640px;
    height: 540px;

    flex: 0 0 640px;

    overflow: hidden;

    background: black;
}


/* ========================================
   BACKGROUND
======================================== */

#background {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-position:
        center;

    background-repeat:
        no-repeat;

    z-index: 1;
}


/* ========================================
   FLOWERS
======================================== */

#flowers {
    position: absolute;

    inset: 0;

    width: 640px;
    height: 540px;

    object-fit: fill;

    pointer-events: none;

    user-select: none;

    z-index: 10;
}


/* ========================================
   CLEAN REVEAL AREA
======================================== */

#reveal {
    position: absolute;

    width: 145px;
    height: 145px;

    border-radius: 50%;

    overflow: hidden;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 30;
}


/* ========================================
   CLEAN BACKGROUND INSIDE GLASS
======================================== */

#revealBackground {
    position: absolute;

    width: 640px;
    height: 540px;

    left: 0;
    top: 0;

    background-image:
        url("background.jpg");

    background-size:
        640px 540px;

    background-position:
        center;

    background-repeat:
        no-repeat;
}


/* ========================================
   HIDDEN OBJECT INSIDE GLASS
======================================== */

#revealObject {
    position: absolute;

    pointer-events: none;

    user-select: none;
}


/* ========================================
   MAGNIFYING GLASS PNG
======================================== */

#glass {
    position: absolute;

    width: 210px;
    height: auto;

    transform:
        translate(-50%, -50%);

    transform-origin:
        center;

    pointer-events: none;

    user-select: none;

    display: none;

    z-index: 31;
}


/* ========================================
   NPC SIDE
   320 x 540
======================================== */

#npcSide {
    position: relative;

    width: 320px;
    height: 540px;

    flex: 0 0 320px;

    overflow: hidden;

    background: #080808;

    display: flex;
    justify-content: center;
    align-items: flex-end;
}


#npcSide::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(60,60,60,0.18),
            rgba(0,0,0,0.9)
        );

    pointer-events: none;
}


/* ========================================
   NPC
======================================== */

#npc {
    position: relative;

    z-index: 5;

    width: 310px;

    max-width: 100%;
    max-height: 530px;

    object-fit: contain;

    object-position:
        bottom center;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 6px 14px
            rgba(0,0,0,0.85)
        );
}


/* ========================================
   DIVIDER
======================================== */

#divider {
    position: absolute;

    left: 639px;
    top: 0;

    width: 2px;
    height: 540px;

    background:
        rgba(255,255,255,0.15);

    pointer-events: none;

    z-index: 200;
}


/* ========================================
   FADE
======================================== */

#fade {
    position: absolute;

    inset: 0;

    background: black;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.65s ease;

    z-index: 500;
}


#fade.active {
    opacity: 1;
}


/* ========================================
   1964 FLASH
======================================== */

#flash1964 {
    position: absolute;

    inset: 0;

    width: 960px;
    height: 540px;

    background: black;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 9999;
}


#flash1964 img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;

    user-select: none;
}


/* ========================================
   RESPONSIVE
======================================== */

@media (max-width: 960px) {

    #layout {
        transform:
            scale(0.8);
    }

}

@media (max-width: 780px) {

    #layout {
        transform:
            scale(0.65);
    }

}

@media (max-width: 620px) {

    #layout {
        transform:
            scale(0.5);
    }

}

</style>

</head>


<body>


<div id="layout">


    <!-- LEFT GAME -->

    <div id="gameSide">

        <div id="background"></div>


        <img
            id="flowers"
            src="flowers.png"
            alt=""
            draggable="false"
        >


        <!-- flower-free view -->

        <div id="reveal">

            <div
                id="revealBackground"
            ></div>


            <img
                id="revealObject"
                src="mitten.png"
                alt=""
                draggable="false"
            >

        </div>


        <!-- REAL PNG MAGNIFYING GLASS -->

        <img
            id="glass"
            src="magnifyingglass.png"
            alt=""
            draggable="false"
        >

    </div>



    <div id="divider"></div>



    <!-- NPC -->

    <div id="npcSide">

        <img
            id="npc"
            src="npc.png"
            alt="Character"
            draggable="false"
        >

    </div>



    <div id="fade"></div>



    <!-- FINAL IMAGE -->

    <div id="flash1964">

        <img
            src="1964.png"
            alt=""
            draggable="false"
        >

    </div>


</div>



<!-- NPC VOICE -->

<audio
    id="voiceAudio"
    preload="auto"
></audio>


<!-- BACKGROUND MUSIC -->

<audio
    id="backgroundMusic"
    src="daisy.wav"
    preload="auto"
    loop
></audio>



<script>

/* ========================================
   ELEMENTS
======================================== */

const gameSide =
    document.getElementById(
        "gameSide"
    );


const reveal =
    document.getElementById(
        "reveal"
    );


const revealBackground =
    document.getElementById(
        "revealBackground"
    );


const revealObject =
    document.getElementById(
        "revealObject"
    );


const glass =
    document.getElementById(
        "glass"
    );


const fade =
    document.getElementById(
        "fade"
    );


const flash1964 =
    document.getElementById(
        "flash1964"
    );


const voiceAudio =
    document.getElementById(
        "voiceAudio"
    );


const backgroundMusic =
    document.getElementById(
        "backgroundMusic"
    );



/* ========================================
   ROUND SETTINGS
======================================== */

const rounds = [

    {
        object:
            "mitten.png",

        voice:
            "mitten.wav",

        startDistortion:
            0,

        centerX:
            200,

        centerY:
            360,

        width:
            85,

        height:
            85
    },


    {
        object:
            "lantern.png",

        voice:
            "lantern.wav",

        startDistortion:
            20,

        centerX:
            465,

        centerY:
            250,

        width:
            95,

        height:
            120
    },


    {
        object:
            "car.png",

        voice:
            "car.wav",

        startDistortion:
            45,

        centerX:
            335,

        centerY:
            350,

        width:
            180,

        height:
            100
    }

];



/* ========================================
   VARIABLES
======================================== */

let currentRound =
    0;


let roundChanging =
    false;


let glassActive =
    false;


let glassX =
    0;


let glassY =
    0;


let audioUnlocked =
    false;


let voiceTimer =
    null;


let repeatDelay =
    2000;


let distortionAmount =
    0;


const MUSIC_VOLUME =
    0.18;



/* ========================================
   WEB AUDIO
======================================== */

let audioContext =
    null;


let voiceSource =
    null;


let distortion =
    null;


let voiceGain =
    null;



/* ========================================
   SETUP DISTORTION
======================================== */

function setupAudioGraph() {


    if (audioContext) {

        return;

    }


    audioContext =

        new (

            window.AudioContext

            ||

            window.webkitAudioContext

        )();


    voiceSource =

        audioContext
            .createMediaElementSource(
                voiceAudio
            );


    distortion =

        audioContext
            .createWaveShaper();


    voiceGain =

        audioContext
            .createGain();


    voiceSource.connect(
        distortion
    );


    distortion.connect(
        voiceGain
    );


    voiceGain.connect(
        audioContext.destination
    );


    distortion.oversample =
        "4x";


    voiceGain.gain.value =
        1.0;

}



/* ========================================
   DISTORTION CURVE
======================================== */

function makeDistortionCurve(amount) {


    const samples =
        44100;


    const curve =
        new Float32Array(
            samples
        );


    const deg =
        Math.PI / 180;


    const k =
        Math.max(
            amount,
            0
        );


    for (
        let i = 0;
        i < samples;
        i++
    ) {


        const x =
            i * 2 / samples - 1;


        curve[i] =

            (
                3 + k
            )

            *

            x

            *

            20

            *

            deg

            /

            (
                Math.PI

                +

                k

                *

                Math.abs(x)
            );

    }


    return curve;

}



/* ========================================
   LOAD ROUND
======================================== */

function loadRound(index) {


    const round =
        rounds[index];


    const objectLeft =

        round.centerX

        -

        round.width / 2;


    const objectTop =

        round.centerY

        -

        round.height / 2;


    revealObject.src =
        round.object;


    revealObject.style.left =
        objectLeft + "px";


    revealObject.style.top =
        objectTop + "px";


    revealObject.style.width =
        round.width + "px";


    revealObject.style.height =
        round.height + "px";


    repeatDelay =
        2000;


    distortionAmount =
        round.startDistortion;


    clearTimeout(
        voiceTimer
    );


    if (audioUnlocked) {


        setTimeout(

            function() {


                playVoice();


                startVoiceReminder();


            },

            350

        );


    }

}



/* ========================================
   PLAY VOICE
======================================== */

function playVoice() {


    if (!audioUnlocked) {

        return;

    }


    const round =
        rounds[currentRound];


    setupAudioGraph();


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext.resume();


    }


    voiceAudio.pause();


    voiceAudio.currentTime =
        0;


    voiceAudio.src =
        round.voice;


    voiceAudio.playbackRate =
        1.0;


    distortion.curve =

        makeDistortionCurve(
            distortionAmount
        );


    voiceAudio
        .play()

        .catch(

            function(error) {


                console.error(
                    "VOICE ERROR:",
                    error
                );


            }

        );

}



/* ========================================
   VOICE REPEAT
======================================== */

function startVoiceReminder() {


    clearTimeout(
        voiceTimer
    );


    const savedRound =
        currentRound;


    voiceTimer =

        setTimeout(

            function() {


                if (

                    savedRound !==
                    currentRound

                    ||

                    roundChanging

                ) {


                    return;


                }


                distortionAmount +=
                    12;


                if (
                    distortionAmount > 120
                ) {


                    distortionAmount =
                        120;


                }


                playVoice();


                repeatDelay -=
                    150;


                if (
                    repeatDelay < 700
                ) {


                    repeatDelay =
                        700;


                }


                startVoiceReminder();


            },

            repeatDelay

        );

}



/* ========================================
   START AUDIO
======================================== */

function unlockAudio() {


    if (audioUnlocked) {

        return;

    }


    audioUnlocked =
        true;


    setupAudioGraph();


    if (
        audioContext.state ===
        "suspended"
    ) {


        audioContext.resume();


    }


    backgroundMusic.volume =
        MUSIC_VOLUME;


    backgroundMusic
        .play()

        .catch(

            function(error) {


                console.error(
                    "DAISY ERROR:",
                    error
                );


            }

        );


    playVoice();


    startVoiceReminder();

}



document.addEventListener(

    "pointerdown",

    unlockAudio,

    {
        once: true
    }

);


document.addEventListener(

    "keydown",

    unlockAudio,

    {
        once: true
    }

);



/* ========================================
   MOVE GLASS
======================================== */

function moveGlass(event) {


    const rect =

        gameSide
            .getBoundingClientRect();


    const scaleX =

        640 /
        rect.width;


    const scaleY =

        540 /
        rect.height;


    const localX =

        (
            event.clientX
            -
            rect.left
        )

        *

        scaleX;


    const localY =

        (
            event.clientY
            -
            rect.top
        )

        *

        scaleY;


    if (

        localX < 0

        ||

        localX > 640

        ||

        localY < 0

        ||

        localY > 540

    ) {


        return;


    }


    glassX =
        localX;


    glassY =
        localY;



    /*
    Move PNG glass.
    */

    glass.style.left =
        localX + "px";


    glass.style.top =
        localY + "px";


    /*
    Move clear reveal circle.
    */

    reveal.style.left =
        localX + "px";


    reveal.style.top =
        localY + "px";


    const halfX =

        reveal.offsetWidth /
        2;


    const halfY =

        reveal.offsetHeight /
        2;



    /*
    Keep clean background aligned.
    */

    revealBackground.style.left =

        (
            -localX
            +
            halfX
        )

        +

        "px";


    revealBackground.style.top =

        (
            -localY
            +
            halfY
        )

        +

        "px";


    /*
    Keep object aligned.
    */

    revealObject.style.transform =

        "translate("

        +

        (
            -localX
            +
            halfX
        )

        +

        "px, "

        +

        (
            -localY
            +
            halfY
        )

        +

        "px)";

}



/* ========================================
   START USING GLASS
======================================== */

gameSide.addEventListener(

    "pointerdown",

    function(event) {


        if (roundChanging) {

            return;

        }


        glassActive =
            true;


        reveal.style.display =
            "block";


        glass.style.display =
            "block";


        moveGlass(
            event
        );


        checkObjectFound();


    }

);



/* ========================================
   MOVE WHILE HOLDING
======================================== */

document.addEventListener(

    "pointermove",

    function(event) {


        if (!glassActive) {

            return;

        }


        moveGlass(
            event
        );


        checkObjectFound();


    }

);



/* ========================================
   RELEASE GLASS
======================================== */

document.addEventListener(

    "pointerup",

    function() {


        glassActive =
            false;


        reveal.style.display =
            "none";


        glass.style.display =
            "none";


    }

);



/* ========================================
   CHECK OBJECT CENTER
======================================== */

function checkObjectFound() {


    if (!glassActive) {

        return;

    }


    const round =
        rounds[currentRound];


    const distanceX =

        glassX

        -

        round.centerX;


    const distanceY =

        glassY

        -

        round.centerY;


    const distance =

        Math.sqrt(

            distanceX
            *
            distanceX

            +

            distanceY
            *
            distanceY

        );


    /*
    The lens needs to be near
    the middle of the item.
    */

    if (
        distance < 40
    ) {


        objectFound();


    }

}



/* ========================================
   FOUND OBJECT
======================================== */

function objectFound() {


    if (roundChanging) {

        return;

    }


    roundChanging =
        true;


    clearTimeout(
        voiceTimer
    );


    voiceAudio.pause();


    glassActive =
        false;


    reveal.style.display =
        "none";


    glass.style.display =
        "none";


    /*
    CAR FOUND
    */

    if (

        currentRound >=
        rounds.length - 1

    ) {


        finishGame();


        return;


    }


    fade.classList.add(
        "active"
    );


    setTimeout(

        function() {


            currentRound++;


            loadRound(
                currentRound
            );


            setTimeout(

                function() {


                    fade.classList.remove(
                        "active"
                    );


                    roundChanging =
                        false;


                },

                250

            );


        },

        650

    );

}



/* ========================================
   FINAL CAR ENDING
======================================== */

function finishGame() {


    clearTimeout(
        voiceTimer
    );


    voiceAudio.pause();


    glassActive =
        false;


    reveal.style.display =
        "none";


    glass.style.display =
        "none";


    /*
    Show 1964.png.
    */

    flash1964.style.display =
        "flex";


    /*
    Daisy continues playing.
    */


    /*
    Return to index.html
    after 1 second.
    */

    setTimeout(

        function() {


            window.location.href =
                "index.html";


        },

        1000

    );

}



/* ========================================
   START
======================================== */

loadRound(0);


</script>


</body>

</html>
